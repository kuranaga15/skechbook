<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HTMLスケッチブック</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: #555555;
    font-family: sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
  }

  /* ================= ズーム可能な舞台 ================= */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  .zoom-layer {
    transform-origin: center center;
    touch-action: none;
  }

  .book-wrap {
    width: 960px;
    height: 668px;
    position: relative;
    touch-action: none;
  }

  /* ノート本体。背景はJSで NOTEBOOK_BG_URL を挿入して1枚の見開き画像を敷くだけ。
     左右ページの概念やグリッド線・綴じ穴の描画はすべて画像側に含まれる前提。 */
  .notebook {
    position: absolute;
    inset: 0;
    background-color: #fdfdf7;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    box-shadow: inset 0 0 16px rgba(0,0,0,0.08), 0 10px 25px rgba(0,0,0,0.35);
    overflow: hidden;
    touch-action: none;
  }
  .notebook.in-spread .page-edge,
  .notebook.in-spread .hint { display: none !important; }

  .blackout {
    position: fixed; inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
    z-index: 999;
  }
  .blackout.show { opacity: 1; }

  .hint {
    position: absolute;
    bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #9997;
    pointer-events: none;
  }

  .page-edge {
    position: absolute;
    top: 0; bottom: 0;
    width: 46px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    font-size: 24px;
    color: rgba(0,0,0,0.15);
    z-index: 2;
    transition: background .2s, color .2s, opacity .2s;
  }
  .page-edge-left { left: 0; background: linear-gradient(to right, rgba(0,0,0,0.05), transparent); }
  .page-edge-right { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.05), transparent); }
  .notebook.hover-left .page-edge-left,
  .notebook.hover-right .page-edge-right {
    background-color: rgba(74,144,226,0.12);
    color: rgba(74,144,226,0.7);
  }
  .notebook.at-start .page-edge-left { opacity: 0; }
  .notebook.hover-left, .notebook.hover-right { cursor: pointer; }

  .draw-canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 50;
    pointer-events: none;
    touch-action: none;
  }
  .notebook.drawing-mode .draw-canvas { pointer-events: auto; cursor: crosshair; }
  .notebook.drawing-mode .frame { pointer-events: none; }
  .notebook.erasing-mode .draw-canvas { cursor: cell; }

  .thumb-panel {
    position: fixed;
    top: 50%;
    right: 24px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 12px 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    z-index: 500;
  }
  .thumb-panel::-webkit-scrollbar { width: 6px; }
  .thumb-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

  body.mobile-layout .thumb-panel {
    top: 0;
    left: 0;
    right: 0;
    bottom: auto;
    transform: none;
    flex-direction: row;
    align-items: center;
    width: 100%;
    max-height: none;
    height: auto;
    overflow-x: auto;
    overflow-y: hidden;
    border-radius: 0 0 14px 14px;
    padding: 8px 12px;
    padding-top: max(8px, env(safe-area-inset-top));
  }
  body.mobile-layout .thumb-panel::-webkit-scrollbar { height: 6px; width: auto; }

  .thumb-item {
    position: relative;
    width: 74px;
    height: 52px;
    background-color: #fdfdf7;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    border: 2px solid transparent;
    border-radius: 5px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    flex-shrink: 0;
    transition: border-color .2s, transform .15s;
  }
  .thumb-item:hover { transform: scale(1.05); }
  .thumb-item.active { border-color: #4a90e2; }
  .thumb-item.dragging {
    opacity: 0.5;
    transform: scale(0.95);
  }

  .thumb-inner {
    position: absolute;
    top: 0; left: 0;
    width: 960px;
    height: 668px;
    transform-origin: top left;
    pointer-events: none;
  }

  .thumb-draw-img {
    position: absolute;
    top: 0; left: 0;
    width: 960px; height: 668px;
  }
  .thumb-frame {
    position: absolute;
    transform-origin: center center;
  }
  .thumb-frame img { width: 100%; height: 100%; display: block; }
  .thumb-frame .thumb-text {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #222;
    white-space: pre-wrap; word-break: break-word;
    overflow: hidden;
  }

  .thumb-label {
    position: absolute;
    bottom: 2px; left: 4px;
    font-size: 10px;
    color: #8887;
    z-index: 2;
    pointer-events: none;
  }

  .thumb-delete {
    position: absolute;
    top: 2px; right: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 3;
  }
  .thumb-delete:hover { background: #c0392b; }

  .tool-panel {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 58px;
    transform: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 14px 4px;
    background: #0d0d0d;
    border-radius: 0;
    z-index: 650;
    max-height: 100vh;
    overflow-y: auto;
  }
  .tool-panel::-webkit-scrollbar { width: 6px; }
  .tool-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

  .tool-mode-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #333;
    color: #eee;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, transform .1s, opacity .15s;
    flex-shrink: 0;
  }
  .tool-mode-btn:hover { transform: scale(1.07); }
  .tool-mode-btn.active { background: #4a90e2; color: #fff; }
  .tool-mode-btn.disabled { opacity: 0.3; pointer-events: none; }
  .tool-mode-btn img { width: 19px; height: 19px; display: block; pointer-events: none; }

  .tool-color {
    width: 24px; height: 24px;
    border: none;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    background: transparent;
    flex-shrink: 0;
  }
  .tool-color::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .tool-color::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; }

  .tool-size-wrap {
    position: relative;
    width: 20px;
    height: 50px;
    flex-shrink: 0;
  }
  .tool-size {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 50px;
    margin: 0;
    transform: translate(-50%, -50%) rotate(90deg);
  }

  .tool-divider {
    width: 20px; height: 1px;
    background: rgba(255,255,255,0.2);
    flex-shrink: 0;
  }
  .pen-size-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 2px;
  }
  .pen-size-presets {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
    height: 50px;
  }
  .pen-size-dot {
    border-radius: 50%;
    border: 1.5px solid #888;
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    user-select: none;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .pen-size-dot:hover { transform: scale(1.15); }
  .pen-size-dot.active {
    background: #4a90e2;
    border-color: #4a90e2;
  }
  .pen-size-dot:nth-child(1) { width: 5px;  height: 5px; }
  .pen-size-dot:nth-child(2) { width: 8px;  height: 8px; }
  .pen-size-dot:nth-child(3) { width: 11px; height: 11px; }
  .pen-size-dot:nth-child(4) { width: 16px; height: 16px; }
  .tool-clear-btn, .tool-delete-page-btn {
    font-size: 10px;
    color: #ddd;
    background: rgba(255,255,255,0.08);
    padding: 5px 3px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    line-height: 1.3;
    flex-shrink: 0;
  }
  .tool-clear-btn:hover { background: rgba(192,57,43,0.6); }
  .tool-delete-page-btn:hover { background: rgba(192,57,43,0.6); }

  .tool-io-btn {
    font-size: 10px;
    color: #ddd;
    background: rgba(255,255,255,0.08);
    padding: 5px 3px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    line-height: 1.3;
    flex-shrink: 0;
    width: 100%;
  }
  .tool-io-btn:hover { background: rgba(74,144,226,0.5); }

  body.mobile-layout .tool-panel {
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    transform: none;
    flex-direction: row;
    align-items: center;
    width: 100%;
    max-height: none;
    max-width: 100vw;
    overflow-x: auto;
    overflow-y: hidden;
    border-radius: 14px 14px 0 0;
    padding: 8px 12px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    justify-content: flex-start;
    gap: 8px;
  }
  body.mobile-layout .tool-panel::-webkit-scrollbar { height: 6px; width: auto; }
  body.mobile-layout .tool-panel .tool-divider {
    width: 1px;
    height: 26px;
    flex-shrink: 0;
  }
  body.mobile-layout .pen-size-row {
    flex-direction: row;
  }
  body.mobile-layout .pen-size-row {
    flex-direction: row;
  }
  body.mobile-layout .tool-size-wrap {
    width: 70px;
    height: auto;
  }
  body.mobile-layout .tool-size {
    position: static;
    transform: none;
    width: 70px;
  }
  body.mobile-layout .pen-size-presets {
    flex-direction: row;
    height: auto;
    gap: 4px;
  }
  body.mobile-layout .tool-size {
    transform: none;
    margin: 0;
    width: 70px;
  }
  body.mobile-layout .tool-clear-btn,
  body.mobile-layout .tool-delete-page-btn,
  body.mobile-layout .tool-io-btn {
    width: auto;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .frame {
    position: absolute;
    touch-action: none;
    cursor: grab;
    transform-origin: center center;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
    caret-color: transparent;
    box-shadow: none;
    z-index: 10;
  }
  .frame.selected {
    box-shadow: 0 0 0 2px #4a90e2, 0 10px 25px rgba(0,0,0,0.4);
  }
  .frame.cropping {
    box-shadow: 0 0 0 2px #27ae60, 0 10px 25px rgba(0,0,0,0.4);
  }
  .frame img {
    width: 100%; height: 100%;
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    caret-color: transparent;
  }
  .frame.cropping img {
    opacity: 0.5;
  }

  .crop-mask {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
  }
  .frame.cropping .crop-mask {
    display: block;
  }
  .crop-mask-overlay {
    position: absolute;
    background: rgba(0,0,0,0.5);
  }
  .crop-mask-top { top: 0; left: 0; right: 0; }
  .crop-mask-bottom { bottom: 0; left: 0; right: 0; }
  .crop-mask-left { left: 0; }
  .crop-mask-right { right: 0; }
  .crop-area {
    position: absolute;
    border: 2px solid #27ae60;
    background: transparent;
    cursor: move;
    pointer-events: auto;
    touch-action: none;
  }

  .crop-handle {
    position: absolute;
    width: 14px; height: 14px;
    background: #fff;
    border: 2px solid #27ae60;
    border-radius: 50%;
    pointer-events: auto;
    z-index: 5;
    touch-action: none;
  }
  .crop-handle.nw { left: -7px; top: -7px; cursor: nwse-resize; }
  .crop-handle.ne { right: -7px; top: -7px; cursor: nesw-resize; }
  .crop-handle.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
  .crop-handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }

  .text-content {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #222;
    padding: 4px 8px;
    outline: none;
    cursor: grab;
    user-select: none;
    caret-color: transparent;
    white-space: pre-wrap;
    word-break: break-word;
    overflow: hidden;
  }
  .text-content.editing {
    cursor: text;
    user-select: text;
    -webkit-user-select: text;
    caret-color: #222;
    background: rgba(74,144,226,0.06);
  }

  .handle {
    position: absolute;
    width: 14px; height: 14px;
    background: #fff;
    border: 2px solid #4a90e2;
    border-radius: 50%;
    display: none;
    z-index: 5;
    touch-action: none;
  }
  .frame.selected .handle { display: block; }
  .frame.cropping .handle { display: none !important; }
  .frame.editing-frame .handle { display: none !important; }
  .handle.nw { left: -7px; top: -7px; cursor: nwse-resize; }
  .handle.ne { right: -7px; top: -7px; cursor: nesw-resize; }
  .handle.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
  .handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }

  .toolbar {
    position: absolute;
    left: 50%; top: 100%;
    display: none;
    gap: 8px;
    background: rgba(20,20,20,0.85);
    padding: 6px 10px;
    border-radius: 20px;
    z-index: 6;
  }
  .frame.selected .toolbar { display: flex; }
  .frame.cropping .toolbar { display: none !important; }
  .frame.editing-frame .toolbar { display: none !important; }

  .crop-controls {
    position: absolute;
    left: 50%; top: 100%;
    transform: translate(-50%, 10px);
    display: none;
    gap: 12px;
    background: rgba(20,20,20,0.9);
    padding: 8px;
    border-radius: 24px;
    z-index: 6;
  }
  .frame.cropping .crop-controls { display: flex; }

  .crop-control-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: transform .15s;
  }
  .crop-control-btn:hover { transform: scale(1.1); }
  .crop-apply {
    background: #27ae60;
    color: #fff;
  }
  .crop-cancel {
    background: #c0392b;
    color: #fff;
  }

  .tool-btn {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #333; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  .tool-btn:hover { background: #4a90e2; }
  .tool-rotate { cursor: grab; touch-action: none; }
  .tool-delete:hover { background: #c0392b; }
  .tool-crop:hover { background: #27ae60; }

  .add-text-btn {
    position: absolute;
    transform: translate(-10px, -10px);
    background: #4a90e2; color: #fff;
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
    z-index: 50;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    white-space: nowrap;
  }
  .add-text-btn:hover { background: #357abd; }

  /* ================= 見開きビュー（1枚のノート画像を拡大表示するだけのシンプル版） ================= */
  .spread-view {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 600;
  }
  .spread-view.show { display: flex; }

  .spread-page-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
  }

  .spread-page {
    width: var(--spread-page-w, 480px);
    height: var(--spread-page-h, 334px);
    background-color: #fdfdf7;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
  }

  .spread-page-label {
    color: #999;
    font-size: 12px;
  }

  .spread-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px; height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    cursor: pointer;
    transition: background .15s;
  }
  .spread-nav:hover { background: rgba(74,144,226,0.5); }
  .spread-nav.disabled { opacity: 0.25; pointer-events: none; }
  .spread-nav-prev { left: 24px; }
  .spread-nav-next { right: 24px; }


  .spread-close-btn {
    position: absolute;
    top: 20px;
    right: 24px;
    background: rgba(192,57,43,0.85);
    color: #fff;
    padding: 8px 18px;
    border-radius: 18px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  .spread-close-btn:hover { background: rgba(192,57,43,1); }

  @media (max-width: 700px), (max-height: 700px) {
    .spread-page-wrap { gap: 3px; }
    .spread-nav { width: 34px; height: 34px; font-size: 16px; }
    .spread-nav-prev { left: 4px; }
    .spread-nav-next { right: 4px; }
    .spread-close-btn { top: 8px; right: 8px; padding: 6px 12px; font-size: 11px; }
    .spread-page-label { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="zoom-layer" id="zoomLayer">
    <div class="book-wrap" id="bookWrap">
      <div class="notebook" id="notebook">
        <canvas class="draw-canvas" id="drawCanvas" width="1920" height="1336"></canvas>
        <div class="hint" id="hint">ここに画像をドラッグ＆ドロップ／クリックでテキスト追加</div>
        <div class="page-edge page-edge-left">‹</div>
        <div class="page-edge page-edge-right">›</div>
      </div>
    </div>
  </div>
</div>

<div class="tool-panel" id="toolPanel">
  <div class="tool-mode-btn" id="layoutToggleBtn" title="UIの配置を切り替え"><img src="icons/icon-cycle.svg" alt=""></div>
  <div class="tool-divider"></div>
  <div class="tool-mode-btn" id="undoBtn" title="元に戻す (Ctrl+Z)"><img src="icons/icon-undo.svg" alt=""></div>
  <div class="tool-divider"></div>
  <div class="tool-mode-btn" id="importImageBtn" title="画像をインポート"><img src="icons/icon-image.svg" alt=""></div>
  <div class="tool-mode-btn" id="spreadViewBtn" title="拡大表示"><img src="icons/icon-book.svg" alt=""></div>
  <div class="tool-divider"></div>
  <div class="tool-mode-btn active" id="modeSelectBtn" title="選択・移動モード"><img src="icons/icon-cursor.svg" alt=""></div>
  <div class="tool-mode-btn" id="modePenBtn" title="ペン"><img src="icons/icon-pencil.svg" alt=""></div>
  <div class="tool-mode-btn" id="modeEraserBtn" title="消しゴム"><img src="icons/icon-eraser.svg" alt=""></div>
  <div class="tool-divider"></div>
    <input type="color" class="tool-color" id="penColor" value="#1a1a1a" title="ペンの色">
  <div class="pen-size-row" id="penSizeRow">
    <div class="tool-size-wrap">
      <input type="range" class="tool-size" id="penSize" min="1" max="40" value="1" title="太さ">
    </div>
    <div class="pen-size-presets" id="penSizePresets">
      <div class="pen-size-dot" data-size="1" title="1px"></div>
      <div class="pen-size-dot" data-size="2" title="2px"></div>
      <div class="pen-size-dot" data-size="3" title="3px"></div>
      <div class="pen-size-dot" data-size="10" title="10px"></div>
    </div>
  </div>
  <div class="tool-divider"></div>
  <div class="tool-clear-btn" id="clearDrawBtn">✎削除</div>
  <div class="tool-delete-page-btn" id="pageDeleteBtn">□消去</div>
  <div class="tool-divider"></div>
  <div class="tool-io-btn" id="exportBtn">save</div>
  <div class="tool-io-btn" id="importBtn">road</div>
</div>

<input type="file" id="imageImportInput" accept="image/*" multiple style="display:none;">
<input type="file" id="jsonImportInput" accept="application/json,.json" style="display:none;">

<div class="thumb-panel" id="thumbPanel"></div>

<div class="spread-view" id="spreadView">
  <div class="spread-nav spread-nav-prev" id="spreadPrevBtn">‹</div>

/* ============================================================
   保存先をlocalStorage→IndexedDBに変更
   （localStorageは5～10MBほどで頭打ちになるが、IndexedDBは
     ブラウザ・空き容量次第で数百MB～数GB規模まで保存できる）
   ============================================================ */
const IDB_NAME = 'sketchbook-idb';
const IDB_STORE = 'data';

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const EDGE_SIZE = 46;
const THUMB_W = 74, THUMB_H = 52;
let SPREAD_PAGE_W = 480;
let SPREAD_PAGE_H = 334;
const BOOK_W = 960, BOOK_H = 668;

/* 見開きページのサイズを画面に収まるよう動的に計算 */
function updateSpreadPageSize() {
  const isMobile = document.body.classList.contains('mobile-layout');
  const sidebarReserve = isMobile ? 0 : (toolPanel.offsetWidth || 0);
  const availW = window.innerWidth - sidebarReserve;
  const availH = window.innerHeight;
  const navReserve = Math.max(60, Math.min(110, availW * 0.14)) * 2;
  const vMargin = Math.max(90, availH * 0.16);

  const maxW = Math.max(90, availW - navReserve);
  const maxH = Math.max(120, availH - vMargin);
  const ratio = BOOK_W / BOOK_H;

  let w = maxW;
  let h = w / ratio;
  if (h > maxH) {
    h = maxH;
    w = h * ratio;
  }

  SPREAD_PAGE_W = w;
  SPREAD_PAGE_H = h;
  spreadView.style.setProperty('--spread-page-w', w + 'px');
  spreadView.style.setProperty('--spread-page-h', h + 'px');

  if (spreadView.classList.contains('show') && spreadEditMode) {
    mountNotebookInSpread();
  }
}

let pages = [];
let currentIndex = 0;

/* 見開き表示中：ノート本体を見開きビューに移動しているかどうか */
let spreadEditMode = false;

/* 見開きモードのピンチズーム倍率と位置（ノート本体の transform で適用する） */
let spreadZoom = 1;
let spreadPanX = 0, spreadPanY = 0;

let croppingFrame = null;
let cropStartData = null;

/* ============================================================
   ズーム・パン
   ============================================================ */
let bookBaseScale = 1;
let bookUserScale = 1;
let panX = 0, panY = 0;
const MIN_USER_SCALE = 1;
const MAX_USER_SCALE = 8;

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function getViewScale() {
  if (spreadEditMode) return (SPREAD_PAGE_W / BOOK_W) * spreadZoom;
  return bookBaseScale * bookUserScale;
}

function computeBaseScale() {
  const margin = 0.94;
  const availW = stage.clientWidth;
  const availH = stage.clientHeight;
  bookBaseScale = Math.min(availW / BOOK_W, availH / BOOK_H) * margin;
  clampPan();
  applyZoomTransform();
}

function clampPan() {
  /* 以前は画面の半分までしか寄れず、指を離した瞬間にその範囲へ引き戻されて
     端に吸着するように見えた。ノートの大きさ基準で、端が少し (48px) だけ
     画面に残る位置までは補正しない。 */
  const s = getViewScale();
  const keep = 48;
  const maxPanX = stage.clientWidth / 2 + (BOOK_W * s) / 2 - keep;
  const maxPanY = stage.clientHeight / 2 + (BOOK_H * s) / 2 - keep;
  panX = clamp(panX, -maxPanX, maxPanX);
  panY = clamp(panY, -maxPanY, maxPanY);
}

function applyZoomTransform() {
  const total = getViewScale();
  zoomLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${total})`;
}

function screenToNotebook(clientX, clientY) {
  const rect = notebook.getBoundingClientRect();
  const s = getViewScale();
  return {
    x: (clientX - rect.left) / s,
    y: (clientY - rect.top) / s
  };
}
