  <div class="tool-mode-btn" id="spreadViewBtn" title="見開き表示">📖</div>
  <div class="tool-divider"></div>
  <div class="tool-mode-btn active" id="modeSelectBtn" title="選択・移動モード">🖱</div>
  <div class="tool-mode-btn" id="modePenBtn" title="ペン">✏️</div>
  <div class="tool-mode-btn" id="modeEraserBtn" title="消しゴム">🧹</div>
  <div class="tool-divider"></div>
  <input type="color" class="tool-color" id="penColor" value="#1a1a1a" title="ペンの色">
  <input type="range" class="tool-size" id="penSize" min="1" max="40" value="4" title="太さ">
  <div class="tool-divider"></div>
  <div class="tool-clear-btn" id="clearDrawBtn">このページの<br>描画を消す</div>
  <div class="tool-delete-page-btn" id="pageDeleteBtn">このページを<br>削除</div>
  <div class="tool-divider"></div>
  <div class="tool-io-btn" id="exportBtn">📤 書き出す</div>
  <div class="tool-io-btn" id="importBtn">📥 読み込む</div>
</div>

<input type="file" id="imageImportInput" accept="image/*" multiple style="display:none;">
<input type="file" id="jsonImportInput" accept="application/json,.json" style="display:none;">
<input type="file" id="coverImageInput" accept="image/*" style="display:none;">

<div class="thumb-panel" id="thumbPanel"></div>

<div class="spread-view" id="spreadView">
  <div class="spread-close-btn" id="spreadCloseBtn">✕ 閉じる</div>
  <div class="spread-nav spread-nav-prev" id="spreadPrevBtn">‹</div>
  <div class="spread-page-wrap">
    <div class="spread-page empty" id="spreadLeftPage"></div>
    <div class="spread-page-label" id="spreadLeftLabel"></div>
  </div>
  <div class="spread-page-wrap">
    <div class="spread-page" id="spreadRightPage"></div>
    <div class="spread-page-label" id="spreadRightLabel"></div>
  </div>
  <div class="spread-nav spread-nav-next" id="spreadNextBtn">›</div>
</div>

<div class="blackout" id="blackout"></div>

<script>
const cover = document.getElementById('cover');
const stage = document.getElementById('stage');
const zoomLayer = document.getElementById('zoomLayer');
const notebook = document.getElementById('notebook');
const blackout = document.getElementById('blackout');
const hint = document.getElementById('hint');
const thumbPanel = document.getElementById('thumbPanel');
const toolPanel = document.getElementById('toolPanel');
const pageDeleteBtn = document.getElementById('pageDeleteBtn');
const drawCanvas = document.getElementById('drawCanvas');
const ctx = drawCanvas.getContext('2d');

const modeSelectBtn = document.getElementById('modeSelectBtn');
const modePenBtn = document.getElementById('modePenBtn');
const modeEraserBtn = document.getElementById('modeEraserBtn');
const penColorInput = document.getElementById('penColor');
const penSizeInput = document.getElementById('penSize');
const clearDrawBtn = document.getElementById('clearDrawBtn');
const undoBtn = document.getElementById('undoBtn');
const importImageBtn = document.getElementById('importImageBtn');
const imageImportInput = document.getElementById('imageImportInput');

const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const jsonImportInput = document.getElementById('jsonImportInput');

const coverReplaceBtn = document.getElementById('coverReplaceBtn');
const coverImageInput = document.getElementById('coverImageInput');

const spreadViewBtn = document.getElementById('spreadViewBtn');
const spreadView = document.getElementById('spreadView');
const spreadLeftPage = document.getElementById('spreadLeftPage');
const spreadRightPage = document.getElementById('spreadRightPage');
const spreadLeftLabel = document.getElementById('spreadLeftLabel');
const spreadRightLabel = document.getElementById('spreadRightLabel');
const spreadPrevBtn = document.getElementById('spreadPrevBtn');
const spreadNextBtn = document.getElementById('spreadNextBtn');
const spreadCloseBtn = document.getElementById('spreadCloseBtn');

let opened = false;
let zIndexCounter = 20;
let mode = 'select';
let isOnCover = false;

const STORAGE_KEY = 'sketchbook-book-v3';
const EDGE_SIZE = 46;
const THUMB_W = 74, THUMB_H = 100;
let SPREAD_PAGE_W = 320;
let SPREAD_PAGE_H = 430;
const BOOK_W = 640, BOOK_H = 860;

/* 見開きページのサイズを画面に収まるよう動的に計算（スマホで見切れないように） */
function updateSpreadPageSize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const navReserve = Math.max(60, Math.min(110, availW * 0.14)) * 2;
  const gap = 10;
  const vMargin = Math.max(90, availH * 0.16);

  const maxW = Math.max(90, (availW - navReserve - gap) / 2);
  const maxH = Math.max(120, availH - vMargin);
  const ratio = BOOK_W / BOOK_H;

  let w = maxW;
  let h = w / ratio;
  if (h > maxH) {
    h = maxH;
    w = h * ratio;
  }

  SPREAD_PAGE_W = w;
  SPREAD_PAGE_H = h;
  spreadView.style.setProperty('--spread-page-w', w + 'px');
  spreadView.style.setProperty('--spread-page-h', h + 'px');

  if (spreadView.classList.contains('show')) {
    renderSpread();
  }
}

let pages = [];
let currentIndex = 0;
let currentSpread = -1;
let coverImageDataUrl = null;

let croppingFrame = null;
let cropStartData = null;

/* ============================================================
   ズーム・パン（無限ズーム対応の独自実装）
   ============================================================ */
let bookBaseScale = 1;
let bookUserScale = 1;
let panX = 0, panY = 0;
const MIN_USER_SCALE = 1;
const MAX_USER_SCALE = 8;

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function getViewScale() { return bookBaseScale * bookUserScale; }

function computeBaseScale() {
  const margin = 0.94;
  const availW = stage.clientWidth;
  const availH = stage.clientHeight;
  bookBaseScale = Math.min(availW / BOOK_W, availH / BOOK_H) * margin;
  clampPan();
  applyZoomTransform();
}

function clampPan() {
  const maxPanX = stage.clientWidth / 2;
  const maxPanY = stage.clientHeight / 2;
  panX = clamp(panX, -maxPanX, maxPanX);
  panY = clamp(panY, -maxPanY, maxPanY);
}

function applyZoomTransform() {
  const total = getViewScale();
  zoomLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${total})`;
}

function screenToNotebook(clientX, clientY) {
  const rect = notebook.getBoundingClientRect();
  const s = getViewScale();
  return {
    x: (clientX - rect.left) / s,
    y: (clientY - rect.top) / s
  };
}

/* ============================================================
   UIレイアウト切り替え（縦画面：下部ツールバー／上部サムネイル）
   ============================================================ */
const layoutToggleBtn = document.getElementById('layoutToggleBtn');
const LAYOUT_STORAGE_KEY = 'sketchbook-layout-mode';

function detectAutoMobileLayout() {
  // スマホの縦持ちらしき画面サイズを自動判定（判定できない場合はボタンで手動切替）
  return window.innerHeight > window.innerWidth && Math.min(window.innerWidth, window.innerHeight) <= 820;
}

function applyLayoutMode() {
  const savedMode = localStorage.getItem(LAYOUT_STORAGE_KEY);
  const mobileMode = savedMode ? savedMode === 'mobile' : detectAutoMobileLayout();
  document.body.classList.toggle('mobile-layout', mobileMode);
  layoutToggleBtn.classList.toggle('active', mobileMode);

  if (mobileMode) {
    const topH = thumbPanel.offsetHeight || 0;
    const bottomH = toolPanel.offsetHeight || 0;
    stage.style.top = topH + 'px';
    stage.style.bottom = bottomH + 'px';
  } else {
    stage.style.top = '';
    stage.style.bottom = '';
  }

  computeBaseScale();
  updateSpreadPageSize();
}

layoutToggleBtn.addEventListener('click', () => {
  const nowMobile = document.body.classList.contains('mobile-layout');
  localStorage.setItem(LAYOUT_STORAGE_KEY, nowMobile ? 'desktop' : 'mobile');
  applyLayoutMode();
});

window.addEventListener('resize', applyLayoutMode);
window.addEventListener('orientationchange', () => setTimeout(applyLayoutMode, 200));

/* 2本指ピンチズーム・パン */
const touchPointers = new Map();
let isPinching = false;
let pinchStartDist = 0;
let pinchStartUserScale = 1;
let pinchStartMid = { x: 0, y: 0 };
let pinchStartPan = { x: 0, y: 0 };
let activeFrameDragEnd = null;

function distOf(p1, p2) { return Math.hypot(p2.x - p1.x, p2.y - p1.y); }
function midOf(p1, p2) { return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }; }

window.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch') return;
  touchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touchPointers.size === 2) {
    const pts = [...touchPointers.values()];
    pinchStartDist = distOf(pts[0], pts[1]) || 1;
    pinchStartUserScale = bookUserScale;
    pinchStartMid = midOf(pts[0], pts[1]);
    pinchStartPan = { x: panX, y: panY };
    isPinching = true;
    if (isDrawing) endStroke();
    if (strokePending) { strokePending = false; strokeCancelled = false; }
    if (activeFrameDragEnd) { const fn = activeFrameDragEnd; activeFrameDragEnd = null; fn(); }
  }
}, { capture: true });

window.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'touch') return;
  if (!touchPointers.has(e.pointerId)) return;
  touchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (isPinching && touchPointers.size === 2) {
    if (e.cancelable) e.preventDefault();
    const pts = [...touchPointers.values()];
    const newDist = distOf(pts[0], pts[1]);
    const newMid = midOf(pts[0], pts[1]);
    const scaleFactor = newDist / pinchStartDist;
    bookUserScale = clamp(pinchStartUserScale * scaleFactor, MIN_USER_SCALE, MAX_USER_SCALE);
    panX = pinchStartPan.x + (newMid.x - pinchStartMid.x);
    panY = pinchStartPan.y + (newMid.y - pinchStartMid.y);
    applyZoomTransform();
  }
}, { capture: true, passive: false });

function releaseTouchPointer(e) {
  if (e.pointerType !== 'touch') return;
  touchPointers.delete(e.pointerId);
  if (touchPointers.size === 0) {
    isPinching = false;
    clampPan();
    applyZoomTransform();
  }
}
window.addEventListener('pointerup', releaseTouchPointer, { capture: true });
window.addEventListener('pointercancel', releaseTouchPointer, { capture: true });

/* デスクトップ：ホイールでもズーム／ダブルクリックでリセット */
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = -e.deltaY * 0.0015;
  bookUserScale = clamp(bookUserScale * (1 + delta), MIN_USER_SCALE, MAX_USER_SCALE);
  applyZoomTransform();
}, { passive: false });

stage.addEventListener('dblclick', (e) => {
  if (e.target.closest('.frame')) return;
  bookUserScale = 1;
  panX = 0; panY = 0;
  applyZoomTransform();
});

/* ============================================================
   Undo
   ============================================================ */
const MAX_UNDO = 25;
let undoStack = [];

function snapshotStateString() {
  if (!isOnCover) {
    pages[currentIndex].frames = collectFramesFromDOM();
  }
  return JSON.stringify({ pages, currentIndex, isOnCover, coverImageDataUrl });
}

function pushUndo() {
  undoStack.push(snapshotStateString());
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  updateUndoButtonState();
}

function undo() {
  if (undoStack.length === 0) return;
  const snapshot = JSON.parse(undoStack.pop());
  pages = snapshot.pages;
  currentIndex = Math.min(snapshot.currentIndex, pages.length - 1);
  isOnCover = snapshot.isOnCover || false;
  coverImageDataUrl = snapshot.coverImageDataUrl || null;
  applyCoverImage();

  if (isOnCover) {
    showCover();
  } else {
    hideCover();
    renderPage(currentIndex);
  }

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ opened, currentIndex, pages, isOnCover, coverImageDataUrl }));
  } catch (e) { /* ignore */ }
  renderThumbnails();
  updateUndoButtonState();
}

function updateUndoButtonState() {
  undoBtn.classList.toggle('disabled', undoStack.length === 0);
}

undoBtn.addEventListener('click', () => undo());

document.addEventListener('keydown', (e) => {
  const isUndoKey = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z';
  if (!isUndoKey) return;

  const active = document.activeElement;
  if (active && active.classList.contains('text-content') && active.classList.contains('editing')) {
    return;
  }
  e.preventDefault();
  undo();
});

/* ============================================================
   画像インポート（ボタン経由・iOS対応）
   ============================================================ */
importImageBtn.addEventListener('click', () => {
  if (isOnCover) return;
  imageImportInput.value = '';
  imageImportInput.click();
});

imageImportInput.addEventListener('change', (e) => {
  const files = [...e.target.files];
  if (!files.length) return;

  const centerX = BOOK_W / 2;
  const centerY = BOOK_H / 2;

  files.forEach((file, i) => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const offset = i * 24;
      createImageFrame(ev.target.result, centerX + offset, centerY + offset);
    };
    reader.readAsDataURL(file);
  });
});

/* ============================================================
   表紙画像の差し替え
   ============================================================ */
coverReplaceBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  coverImageInput.value = '';
  coverImageInput.click();
});
coverReplaceBtn.addEventListener('pointerdown', (e) => e.stopPropagation());

coverImageInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    pushUndo();
    coverImageDataUrl = ev.target.result;
    applyCoverImage();
    persistAll();
  };
  reader.readAsDataURL(file);
});

function applyCoverImage() {
  if (coverImageDataUrl) {
    cover.style.backgroundImage = `url(${coverImageDataUrl})`;
    cover.classList.add('has-image');
  } else {
    cover.style.backgroundImage = '';
    cover.classList.remove('has-image');
  }
}

/* ============================================================
   JSONエクスポート／インポート
   ============================================================ */
function pad2(n) { return String(n).padStart(2, '0'); }

exportBtn.addEventListener('click', () => {
  if (!isOnCover) {
    pages[currentIndex].frames = collectFramesFromDOM();
    pages[currentIndex].drawing = drawCanvas.toDataURL('image/png');
  }

  const exportData = {
    formatVersion: 2,
    exportedAt: new Date().toISOString(),
    opened,
    currentIndex,
    pages,
    isOnCover,
    coverImageDataUrl
  };

  let jsonStr;
  try {
    jsonStr = JSON.stringify(exportData);
  } catch (e) {
    alert('書き出しに失敗しました。データが大きすぎる可能性があります。');
    return;
  }

  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);

  const now = new Date();
  const fname = `sketchbook-${now.getFullYear()}${pad2(now.getMonth()+1)}${pad2(now.getDate())}-${pad2(now.getHours())}${pad2(now.getMinutes())}.json`;

  const a = document.createElement('a');
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

importBtn.addEventListener('click', () => {
  jsonImportInput.value = '';
  jsonImportInput.click();
});

jsonImportInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (ev) => {
    let data;
    try {
      data = JSON.parse(ev.target.result);
    } catch (err) {
      alert('このファイルは正しいJSON形式ではありません。');
      return;
    }

    if (!data || !Array.isArray(data.pages) || data.pages.length === 0) {
      alert('スケッチブックのデータとして認識できませんでした。');
      return;
    }

    const ok = confirm('読み込むと今のノートの内容は上書きされます。よろしいですか？\n（読み込み後は元に戻すボタンで復元できます）');
    if (!ok) return;

    pushUndo();

    pages = data.pages;
    currentIndex = Math.min(data.currentIndex || 0, pages.length - 1);
    opened = data.opened !== undefined ? !!data.opened : true;
    isOnCover = data.isOnCover || false;
    coverImageDataUrl = data.coverImageDataUrl || null;
    applyCoverImage();

    if (opened) {
      cover.classList.add('no-anim', 'open');
      cover.style.pointerEvents = 'none';
    } else {
      cover.classList.remove('open');
      cover.style.pointerEvents = '';
    }

    if (isOnCover) {
      showCover();
    } else {
      hideCover();
      renderPage(currentIndex);
    }

    persistAll();
    alert('読み込みが完了しました。');
  };
  reader.onerror = () => {
    alert('ファイルの読み込みに失敗しました。');
  };
  reader.readAsText(file);
});

/* ============================================================
   モード切替
   ============================================================ */
function setMode(newMode) {
  if (isOnCover) return;
  mode = newMode;
  modeSelectBtn.classList.toggle('active', mode === 'select');
  modePenBtn.classList.toggle('active', mode === 'pen');
  modeEraserBtn.classList.toggle('active', mode === 'eraser');
  notebook.classList.toggle('drawing-mode', mode !== 'select');
  notebook.classList.toggle('erasing-mode', mode === 'eraser');

  if (mode !== 'select') {
    document.querySelectorAll('.frame.selected').forEach(f => f.classList.remove('selected'));
    removeAddTextButton();
  }
}
modeSelectBtn.addEventListener('click', () => setMode('select'));
modePenBtn.addEventListener('click', () => setMode('pen'));
modeEraserBtn.addEventListener('click', () => setMode('eraser'));

/* ============================================================
   手書き描画処理
   ============================================================ */
let isDrawing = false;
let lastX = 0, lastY = 0;

/* ---- タッチでの「スワイプ」誤描画防止 ----
   指（touch）で触れた瞬間はまだ描画を確定させず、ごく短い時間だけ
   動きを観察する。速く・大きく動いたら「スワイプ（操作ミス）」と判断して
   一切描画しない。ゆっくりした動き、またはそのまま指を離した場合（タップ）は
   通常どおり描画として確定させる。マウス／ペン入力は従来どおり即描画。 */
const SWIPE_CONFIRM_MS = 55;   // この時間内の動きを見て判定する
const SWIPE_DISTANCE_PX = 14;  // 判定時間内にこれ以上動いたらスワイプとみなす
let strokePending = false;
let strokeCancelled = false;
let pendingPointerId = null;
let pendingStartClient = { x: 0, y: 0 };
let pendingStartTime = 0;

function canvasPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

function beginActualStroke(e) {
  pushUndo();
  isDrawing = true;
  const p = canvasPos(e);
  lastX = p.x; lastY = p.y;

  ctx.beginPath();
  ctx.arc(p.x, p.y, (mode === 'eraser' ? getEraserSize() : getPenSize()) / 2, 0, Math.PI * 2);
  applyStrokeStyle();
  ctx.fill();
}

drawCanvas.addEventListener('pointerdown', (e) => {
  if (mode === 'select' || isOnCover) return;
  if (isPinching) return;
  if (e.cancelable) e.preventDefault();
  drawCanvas.setPointerCapture(e.pointerId);

  if (e.pointerType === 'touch') {
    strokePending = true;
    strokeCancelled = false;
    pendingPointerId = e.pointerId;
    pendingStartClient = { x: e.clientX, y: e.clientY };
    pendingStartTime = performance.now();
  } else {
    beginActualStroke(e);
  }
}, { passive: false });

drawCanvas.addEventListener('pointermove', (e) => {
  if (strokeCancelled) return;

  if (strokePending) {
    if (e.pointerId !== pendingPointerId) return;
    const dist = Math.hypot(e.clientX - pendingStartClient.x, e.clientY - pendingStartClient.y);
    const elapsed = performance.now() - pendingStartTime;

    if (dist > SWIPE_DISTANCE_PX) {
      // 短時間で大きく動いた＝スワイプと判定し、描画をキャンセル
      strokePending = false;
      strokeCancelled = true;
      return;
    }
    if (elapsed < SWIPE_CONFIRM_MS) {
      return; // まだ判定中
    }
    // ゆっくりした動き＝意図した描画と判定して開始
    strokePending = false;
    beginActualStroke(e);
  }

  if (!isDrawing) return;
  if (e.cancelable) e.preventDefault();
  const p = canvasPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  applyStrokeStyle();
  ctx.stroke();
  lastX = p.x; lastY = p.y;
}, { passive: false });

function endStroke(e, opts) {
  const isAbort = !!(opts && opts.abort);
  if (strokePending) {
    strokePending = false;
    if (!strokeCancelled && !isAbort && e) {
      // 判定が確定する前に指を離した＝軽いタップとして点を描画する
      beginActualStroke(e);
    }
  }
  strokeCancelled = false;
  if (!isDrawing) return;
  isDrawing = false;
  persistDrawing();
}
drawCanvas.addEventListener('pointerup', (e) => endStroke(e));
drawCanvas.addEventListener('pointerleave', (e) => endStroke(e));
drawCanvas.addEventListener('pointercancel', (e) => endStroke(e, { abort: true }));

function getPenSize() { return parseFloat(penSizeInput.value) || 4; }
function getEraserSize() { return getPenSize() * 3; }

function applyStrokeStyle() {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (mode === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = getEraserSize();
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = penColorInput.value;
    ctx.fillStyle = penColorInput.value;
    ctx.lineWidth = getPenSize();
  }
}

clearDrawBtn.addEventListener('click', () => {
  if (isOnCover) return;
  const ok = confirm('このページの手書きをすべて消しますか？');
  if (!ok) return;
  pushUndo();
  ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  persistDrawing();
});

function persistDrawing() {
  if (isOnCover) return;
  pages[currentIndex].drawing = drawCanvas.toDataURL('image/png');
  persistAll();
}

function loadDrawingIntoCanvas(dataUrl) {
  ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  if (!dataUrl) return;
  const img = new Image();
  img.onload = () => ctx.drawImage(img, 0, 0, drawCanvas.width, drawCanvas.height);
  img.src = dataUrl;
}

/* ============================================================
   保存・復元
   ============================================================ */
function collectFramesFromDOM() {
  return [...notebook.querySelectorAll('.frame')].map(frame => {
    const isText = !!frame.querySelector('.text-content');
    return {
      type: isText ? 'text' : 'image',
      src: isText ? null : frame.querySelector('img').src,
      text: isText ? frame.querySelector('.text-content').innerText : null,
      left: parseFloat(frame.style.left),
      top: parseFloat(frame.style.top),
      w: parseFloat(frame.style.width),
      h: parseFloat(frame.style.height),
      angle: parseFloat(frame.dataset.angle) || 0,
      scale: parseFloat(frame.dataset.scale) || 1,
      z: parseInt(frame.style.zIndex) || 20
    };
  });
}

function persistAll() {
  try {
    if (!isOnCover) {
      pages[currentIndex].frames = collectFramesFromDOM();
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ opened, currentIndex, pages, isOnCover, coverImageDataUrl }));
  } catch (e) {
    console.warn('保存に失敗しました（容量オーバーの可能性）', e);
    alert('データ容量が大きすぎて保存できませんでした。画像や手書きの量を減らしてください。');
  } finally {
    renderThumbnails();
  }
}

function restoreAll() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.pages) && data.pages.length > 0) {
        pages = data.pages;
        currentIndex = Math.min(data.currentIndex || 0, pages.length - 1);
        opened = !!data.opened;
        isOnCover = !!data.isOnCover;
        coverImageDataUrl = data.coverImageDataUrl || null;
        return;
      }
    } catch (e) { /* ignore */ }
  }
  pages = [{ side: 'right', frames: [], drawing: null }];
  currentIndex = 0;
  opened = false;
  isOnCover = false;
  coverImageDataUrl = null;
}

/* ============================================================
   表紙の表示・非表示
   ============================================================ */
function showCover() {
  if (!isOnCover && currentIndex < pages.length) {
    pages[currentIndex].frames = collectFramesFromDOM();
    pages[currentIndex].drawing = drawCanvas.toDataURL('image/png');
  }

  isOnCover = true;
  notebook.classList.add('hidden');
  cover.classList.remove('open', 'no-anim');
  cover.style.pointerEvents = '';
  opened = false;
  renderThumbnails();
}

function hideCover() {
  isOnCover = false;
  notebook.classList.remove('hidden');
  if (opened) {
    cover.classList.add('no-anim', 'open');
    cover.style.pointerEvents = 'none';
  }
}

/* ============================================================
   本を開く演出
   ============================================================ */
cover.addEventListener('click', (e) => {
  if (opened) return;
  const rect = cover.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  if (clickX < rect.width / 2) return;

  opened = true;
  isOnCover = false;
  blackout.classList.add('show');
  setTimeout(() => cover.classList.add('open'), 150);

  cover.addEventListener('transitionend', () => {
    cover.style.pointerEvents = 'none';
    blackout.classList.remove('show');
    notebook.classList.remove('hidden');
    renderPage(currentIndex);
    persistAll();
  }, { once: true });
});

window.addEventListener('DOMContentLoaded', () => {
  restoreAll();
  applyCoverImage();
  applyLayoutMode();

  if (isOnCover) {
    showCover();
  } else {
    hideCover();
    if (opened) {
      cover.classList.add('no-anim', 'open');
      cover.style.pointerEvents = 'none';
    }
    renderPage(currentIndex);
  }

  renderThumbnails();
  updateUndoButtonState();
});

/* ============================================================
   ページ描画・ページめくり
   ============================================================ */
function renderPage(index) {
  notebook.querySelectorAll('.frame').forEach(f => f.remove());
  removeAddTextButton();

  const side = pages[index].side;
  notebook.classList.toggle('left-page', side === 'left');
  notebook.classList.toggle('right-page', side !== 'left');
  notebook.classList.toggle('at-start', index === 0);

  loadDrawingIntoCanvas(pages[index].drawing);

  const frames = pages[index].frames || [];
  frames.forEach(data => {
    buildFrame({
      type: data.type,
      src: data.src,
      text: data.text,
      x: data.left + data.w / 2,
      y: data.top + data.h / 2,
      w: data.w,
      h: data.h,
      angle: data.angle,
      scale: data.scale,
      z: data.z,
      skipSelect: true
    });
  });

  hint.style.display = (frames.length || pages[index].drawing) ? 'none' : 'block';
}

function goForward() {
  if (isOnCover) return;
  pages[currentIndex].frames = collectFramesFromDOM();
  const isNewPage = currentIndex === pages.length - 1;
  if (isNewPage) {
    pushUndo();
    const nextSide = pages.length % 2 === 0 ? 'right' : 'left';
    pages.push({ side: nextSide, frames: [], drawing: null });
  }
  transitionTo(currentIndex + 1);
}

function goBackward() {
  if (isOnCover || currentIndex === 0) return;
  pages[currentIndex].frames = collectFramesFromDOM();
  transitionTo(currentIndex - 1);
}

function transitionTo(newIndex) {
  blackout.classList.add('show');
  const onFadeIn = () => {
    blackout.removeEventListener('transitionend', onFadeIn);
    currentIndex = newIndex;
    renderPage(currentIndex);
    persistAll();
    requestAnimationFrame(() => blackout.classList.remove('show'));
  };
  blackout.addEventListener('transitionend', onFadeIn, { once: true });
}

/* ============================================================
   ページ削除機能
   ============================================================ */
function recomputeSides() {
  pages.forEach((p, i) => { p.side = i % 2 === 0 ? 'right' : 'left'; });
}

function deletePage(index) {
  if (pages.length <= 1) {
    alert('これ以上ページを削除できません（最低1ページ必要です）。');
    return;
  }
  const ok = confirm('このページを削除しますか？貼り付けた画像・テキスト・手書きも失われます。');
  if (!ok) return;

  pushUndo();

  pages.splice(index, 1);
  recomputeSides();

  if (index < currentIndex) currentIndex -= 1;
  currentIndex = Math.min(currentIndex, pages.length - 1);

  renderPage(currentIndex);
  persistAll();
}

pageDeleteBtn.addEventListener('click', (e) => {
  if (isOnCover) return;
  e.stopPropagation();
  deletePage(currentIndex);
});

/* ============================================================
   サムネイル一覧（表紙含む・ドラッグで入れ替え）
   ============================================================ */
let draggedThumb = null;
let draggedIndex = -1;

function renderThumbnails() {
  thumbPanel.innerHTML = '';
  const scale = THUMB_W / 640;

  const coverThumb = document.createElement('div');
  coverThumb.className = 'thumb-item cover-thumb' + (isOnCover ? ' active' : '');
  coverThumb.textContent = 'SKETCH BOOK';
  if (coverImageDataUrl) {
    coverThumb.style.backgroundImage = `url(${coverImageDataUrl})`;
  }
  coverThumb.addEventListener('click', () => {
    if (isOnCover) return;
    showCover();
    persistAll();
  });
  thumbPanel.appendChild(coverThumb);

  pages.forEach((page, index) => {
    const item = document.createElement('div');
    item.className = 'thumb-item' + (!isOnCover && index === currentIndex ? ' active' : '');
    item.draggable = true;
    item.dataset.index = index;

    const inner = document.createElement('div');
    inner.className = 'thumb-inner ' + (page.side === 'left' ? 'left-page' : 'right-page');
    inner.style.transform = `scale(${scale})`;

    if (page.drawing) {
      const drawImg = document.createElement('img');
      drawImg.className = 'thumb-draw-img';
      drawImg.src = page.drawing;
      inner.appendChild(drawImg);
    }

    (page.frames || []).forEach(f => {
      const fr = document.createElement('div');
      fr.className = 'thumb-frame';
      fr.style.left = f.left + 'px';
      fr.style.top = f.top + 'px';
      fr.style.width = f.w + 'px';
      fr.style.height = f.h + 'px';
      fr.style.transform = `rotate(${f.angle || 0}deg) scale(${f.scale || 1})`;

      if (f.type === 'image') {
        const img = document.createElement('img');
        img.src = f.src;
        fr.appendChild(img);
      } else {
        const txt = document.createElement('div');
        txt.className = 'thumb-text';
        txt.textContent = f.text || '';
        fr.appendChild(txt);
      }
      inner.appendChild(fr);
    });

    const label = document.createElement('div');
    label.className = 'thumb-label';
    label.textContent = (index + 1);

    const delBtn = document.createElement('div');
    delBtn.className = 'thumb-delete';
    delBtn.textContent = '✕';
    delBtn.title = 'このページを削除';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deletePage(index);
    });

    item.appendChild(inner);
    item.appendChild(label);
    item.appendChild(delBtn);

    item.addEventListener('click', () => {
      if (isOnCover) {
        isOnCover = false;
        opened = true;
        notebook.classList.remove('hidden');
        cover.classList.add('no-anim', 'open');
        cover.style.pointerEvents = 'none';
        currentIndex = index;
        renderPage(currentIndex);
        persistAll();
        return;
      }

      if (index === currentIndex) return;
      pages[currentIndex].frames = collectFramesFromDOM();
      pages[currentIndex].drawing = drawCanvas.toDataURL('image/png');
      transitionTo(index);
    });

    item.addEventListener('dragstart', (e) => {
      draggedThumb = item;
      draggedIndex = index;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      draggedThumb = null;
      draggedIndex = -1;
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!draggedThumb || draggedThumb === item) return;

      const targetIndex = parseInt(item.dataset.index);
      if (draggedIndex === targetIndex) return;

      pushUndo();

      const [movedPage] = pages.splice(draggedIndex, 1);
      pages.splice(targetIndex, 0, movedPage);

      if (!isOnCover) {
        if (currentIndex === draggedIndex) {
          currentIndex = targetIndex;
        } else if (draggedIndex < currentIndex && targetIndex >= currentIndex) {
          currentIndex--;
        } else if (draggedIndex > currentIndex && targetIndex <= currentIndex) {
          currentIndex++;
        }
      }

      draggedIndex = targetIndex;
      persistAll();
    });

    thumbPanel.appendChild(item);
  });
}

/* ============================================================
   見開きプレビュー（表紙も含む）
   ============================================================ */
function getSpreadPair(spreadNum) {
  if (spreadNum === -1) return { leftIdx: -2, rightIdx: -1 };
  if (spreadNum === 0) return { leftIdx: -1, rightIdx: 0 };
  const leftIdx = spreadNum * 2 - 1;
  const rightIdx = spreadNum * 2;
  return {
    leftIdx: leftIdx < pages.length ? leftIdx : -2,
    rightIdx: rightIdx < pages.length ? rightIdx : -2
  };
}

function maxSpreadIndex() {
  return Math.max(0, Math.ceil((pages.length - 1) / 2));
}

function openSpreadView() {
  if (!opened && !isOnCover) return;

  if (isOnCover) {
    currentSpread = -1;
  } else {
    currentSpread = currentIndex === 0 ? 0 : Math.ceil(currentIndex / 2);
  }
  updateSpreadPageSize();
  renderSpread();
  spreadView.classList.add('show');
}

function closeSpreadView() {
  spreadView.classList.remove('show');
}

spreadViewBtn.addEventListener('click', openSpreadView);
spreadCloseBtn.addEventListener('click', closeSpreadView);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && spreadView.classList.contains('show')) {
    closeSpreadView();
  }
});

spreadPrevBtn.addEventListener('click', () => {
  if (currentSpread > -1) {
    currentSpread -= 1;
    renderSpread();
  }
});
spreadNextBtn.addEventListener('click', () => {
  if (currentSpread < maxSpreadIndex()) {
    currentSpread += 1;
    renderSpread();
  }
});

function renderSpread() {
  const { leftIdx, rightIdx } = getSpreadPair(currentSpread);
  buildPagePreview(spreadLeftPage, leftIdx);
  buildPagePreview(spreadRightPage, rightIdx);

  if (leftIdx === -2) {
    spreadLeftLabel.textContent = '';
  } else if (leftIdx === -1) {
    spreadLeftLabel.textContent = '表紙';
  } else {
    spreadLeftLabel.textContent = leftIdx >= 0 ? (leftIdx + 1) : '';
  }

  if (rightIdx === -1) {
    spreadRightLabel.textContent = '表紙';
  } else {
    spreadRightLabel.textContent = rightIdx >= 0 ? (rightIdx + 1) : '';
  }

  spreadPrevBtn.classList.toggle('disabled', currentSpread <= -1);
  spreadNextBtn.classList.toggle('disabled', currentSpread >= maxSpreadIndex());
}

function buildPagePreview(container, pageIndex) {
  container.innerHTML = '';
  container.onclick = null;
  container.classList.remove('left-page', 'right-page', 'cover-page');
  container.style.backgroundImage = '';

  if (pageIndex === -2) {
    container.classList.add('empty');
    return;
  }

  if (pageIndex === -1) {
    container.classList.remove('empty');
    container.classList.add('cover-page');
    container.textContent = 'SKETCH BOOK';
    if (coverImageDataUrl) {
      container.style.backgroundImage = `url(${coverImageDataUrl})`;
    }
    container.onclick = () => {
      try {
        showCover();
        persistAll();
      } catch (err) {
        console.error('表紙表示中にエラーが発生しました', err);
      } finally {
        closeSpreadView();
      }
    };
    return;
  }

  if (pageIndex < 0 || pageIndex >= pages.length) {
    container.classList.add('empty');
    return;
  }
  container.classList.remove('empty');

  const page = pages[pageIndex];

  const inner = document.createElement('div');
  inner.className = 'spread-inner ' + (page.side === 'left' ? 'left-page' : 'right-page');
  const scale = SPREAD_PAGE_W / 640;
  inner.style.transform = `scale(${scale})`;

  if (page.drawing) {
    const drawImg = document.createElement('img');
    drawImg.className = 'spread-draw-img';
    drawImg.src = page.drawing;
    inner.appendChild(drawImg);
  }

  (page.frames || []).forEach(f => {
    const fr = document.createElement('div');
    fr.className = 'spread-frame';
    fr.style.left = f.left + 'px';
    fr.style.top = f.top + 'px';
    fr.style.width = f.w + 'px';
    fr.style.height = f.h + 'px';
    fr.style.transform = `rotate(${f.angle || 0}deg) scale(${f.scale || 1})`;

    if (f.type === 'image') {
      const img = document.createElement('img');
      img.src = f.src;
      fr.appendChild(img);
    } else {
      const txt = document.createElement('div');
      txt.className = 'spread-text';
      txt.textContent = f.text || '';
      fr.appendChild(txt);
    }
    inner.appendChild(fr);
  });

  container.appendChild(inner);

  container.onclick = () => {
    try {
      if (!isOnCover) {
        pages[currentIndex].frames = collectFramesFromDOM();
        try {
          pages[currentIndex].drawing = drawCanvas.toDataURL('image/png');
        } catch (err) {
          console.warn('描画データの保存に失敗しました（画像の読み込み元が原因の可能性があります）', err);
        }
      }

      if (isOnCover) {
        isOnCover = false;
        opened = true;
        notebook.classList.remove('hidden');
        cover.classList.add('no-anim', 'open');
        cover.style.pointerEvents = 'none';
      }

      currentIndex = pageIndex;
      renderPage(currentIndex);
      persistAll();
    } catch (err) {
      console.error('ページ移動中にエラーが発生しました', err);
    } finally {
      closeSpreadView();
    }
  };
}

/* ===== ノート内タップ：端ならページめくり／それ以外はテキスト追加 ===== */
let notebookTapStart = null;

notebook.addEventListener('pointerdown', (e) => {
  if (mode !== 'select' || isOnCover) { notebookTapStart = null; return; }
  if (e.target.closest('.frame') || e.target.closest('.add-text-btn')) { notebookTapStart = null; return; }
  notebookTapStart = { x: e.clientX, y: e.clientY, t: Date.now(), id: e.pointerId };
});

notebook.addEventListener('pointerup', (e) => {
  if (isPinching) { notebookTapStart = null; return; }
  if (!notebookTapStart || e.pointerId !== notebookTapStart.id) return;

  const dx = e.clientX - notebookTapStart.x;
  const dy = e.clientY - notebookTapStart.y;
  const dt = Date.now() - notebookTapStart.t;
  const start = notebookTapStart;
  notebookTapStart = null;

  if (Math.hypot(dx, dy) > 12 || dt > 600) return;
  if (mode !== 'select' || isOnCover) return;

  const rect = notebook.getBoundingClientRect();
  const x = start.x - rect.left;

  if (x >= rect.width - EDGE_SIZE) {
    goForward();
    return;
  }
  if (x <= EDGE_SIZE && currentIndex > 0) {
    goBackward();
    return;
  }
  showAddTextButton({ clientX: start.x, clientY: start.y });
});

notebook.addEventListener('pointercancel', () => { notebookTapStart = null; });

notebook.addEventListener('mousemove', (e) => {
  if (mode !== 'select' || isOnCover) return;
  const rect = notebook.getBoundingClientRect();
  const x = e.clientX - rect.left;
  notebook.classList.toggle('hover-right', x >= rect.width - EDGE_SIZE);
  notebook.classList.toggle('hover-left', x <= EDGE_SIZE && currentIndex > 0);
});
notebook.addEventListener('mouseleave', () => {
  notebook.classList.remove('hover-right', 'hover-left');
});

/* ===== 新規画像のドロップ ===== */
notebook.addEventListener('dragover', (e) => e.preventDefault());

notebook.addEventListener('drop', (e) => {
  e.preventDefault();
  if (mode !== 'select' || isOnCover) return;
  const { x, y } = screenToNotebook(e.clientX, e.clientY);

  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    [...e.dataTransfer.files].forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = ev => createImageFrame(ev.target.result, x, y);
      reader.readAsDataURL(file);
    });
    return;
  }

  const url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  if (url && url.startsWith('http')) {
    createImageFrame(url, x, y);
  }
});

function showAddTextButton(e) {
  removeAddTextButton();
  const { x, y } = screenToNotebook(e.clientX, e.clientY);

  const btn = document.createElement('div');
  btn.className = 'add-text-btn';
  btn.textContent = '＋ テキスト追加';
  btn.style.left = x + 'px';
  btn.style.top = y + 'px';
  btn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    createTextFrame(x, y);
    removeAddTextButton();
  });
  notebook.appendChild(btn);
}

function removeAddTextButton() {
  const existing = notebook.querySelector('.add-text-btn');
  if (existing) existing.remove();
}

document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.frame')) {
    document.querySelectorAll('.frame.selected').forEach(f => f.classList.remove('selected'));
  }
  if (!e.target.closest('.add-text-btn')) {
    removeAddTextButton();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    const active = document.activeElement;
    if (active && active.classList.contains('text-content') && active.classList.contains('editing')) return;
    const sel = document.querySelector('.frame.selected');
    if (sel) {
      pushUndo();
      sel.remove();
      persistAll();
    }
  }
});

/* ===== 画像フレーム生成 ===== */
function createImageFrame(src, x, y) {
  hint.style.display = 'none';
  const probe = new Image();
  probe.onload = () => {
    const maxDim = 200;
    let w = probe.naturalWidth || 160;
    let h = probe.naturalHeight || 160;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    w *= scale; h *= scale;
    pushUndo();
    buildFrame({ type: 'image', src, x, y, w, h });
    persistAll();
  };
  probe.onerror = () => {
    pushUndo();
    buildFrame({ type: 'image', src, x, y, w: 160, h: 160 });
    persistAll();
  };
  probe.src = src;
}

function createTextFrame(x, y) {
  hint.style.display = 'none';
  pushUndo();
  buildFrame({ type: 'text', x, y, w: 180, h: 60 });
}

/* ===== フレーム構築（共通） ===== */
function buildFrame({ type, src, text, x, y, w, h, angle = 0, scale = 1, z, skipSelect = false }) {
  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.style.width = w + 'px';
  frame.style.height = h + 'px';
  frame.style.left = (x - w / 2) + 'px';
  frame.style.top = (y - h / 2) + 'px';
  frame.dataset.angle = angle;
  frame.dataset.scale = scale;
  if (z) {
    frame.style.zIndex = z;
    zIndexCounter = Math.max(zIndexCounter, z);
  }

  const inner = type === 'image'
    ? `<img src="${src}" draggable="false" alt="">`
    : `<div class="text-content" contenteditable="false">${text ? escapeHtml(text) : ''}</div>`;

  const cropBtn = type === 'image' ? '<div class="tool-btn tool-crop" title="トリミング">✂</div>' : '';

  const cropMask = type === 'image' ? `
    <div class="crop-mask">
      <div class="crop-mask-overlay crop-mask-top"></div>
      <div class="crop-mask-overlay crop-mask-bottom"></div>
      <div class="crop-mask-overlay crop-mask-left"></div>
      <div class="crop-mask-overlay crop-mask-right"></div>
      <div class="crop-area">
        <div class="crop-handle nw"></div>
        <div class="crop-handle ne"></div>
        <div class="crop-handle sw"></div>
        <div class="crop-handle se"></div>
      </div>
    </div>
  ` : '';

  const cropControls = type === 'image' ? `
    <div class="crop-controls">
      <div class="crop-control-btn crop-apply" title="適用">✓</div>
      <div class="crop-control-btn crop-cancel" title="キャンセル">✕</div>
    </div>
  ` : '';

  frame.innerHTML = `
    ${inner}
    ${cropMask}
    <div class="handle nw"></div>
    <div class="handle ne"></div>
    <div class="handle sw"></div>
    <div class="handle se"></div>
    <div class="toolbar">
      <div class="tool-btn tool-rotate" title="回転">⟳</div>
      ${cropBtn}
      <div class="tool-btn tool-duplicate" title="複製">⧉</div>
      <div class="tool-btn tool-delete" title="削除">✕</div>
    </div>
    ${cropControls}
  `;

  notebook.appendChild(frame);
  initFrame(frame);
  applyTransform(frame);

  if (!skipSelect) selectFrame(frame);

  if (type === 'text' && !skipSelect) {
    const textEl = frame.querySelector('.text-content');
    enterEditMode(frame, textEl);
  }

  return frame;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.innerText = str;
  return div.innerHTML;
}

/* ===== フレームへのイベント登録 ===== */
function initFrame(frame) {
  frame.addEventListener('dragstart', e => e.preventDefault());

  frame.addEventListener('pointerdown', (e) => {
    if (mode !== 'select') return;
    if (isPinching) return;
    if (e.target.closest('.handle') || e.target.closest('.tool-btn') || e.target.closest('.crop-control-btn') || e.target.closest('.crop-handle')) return;
    if (frame.classList.contains('editing-frame')) return;

    if (!frame.classList.contains('cropping')) {
      selectFrame(frame);
      pushUndo();
      startMove(e, frame);
    }
  });

  frame.querySelectorAll('.handle').forEach(handle => {
    const type =
      handle.classList.contains('nw') ? 'nw' :
      handle.classList.contains('ne') ? 'ne' :
      handle.classList.contains('sw') ? 'sw' : 'se';

    handle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (isPinching) return;
      if (!frame.classList.contains('cropping')) {
        pushUndo();
        startResize(e, frame, type);
      }
    });
  });

  frame.querySelector('.tool-rotate').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    if (isPinching) return;
    pushUndo();
    startRotate(e, frame);
  });

  const cropBtn = frame.querySelector('.tool-crop');
  if (cropBtn) {
    cropBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startCrop(frame);
    });
  }

  const cropArea = frame.querySelector('.crop-area');
  if (cropArea) {
    cropArea.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.crop-handle')) return;
      e.stopPropagation();
      startCropMove(e, frame);
    });
  }

  frame.querySelectorAll('.crop-handle').forEach(handle => {
    const type =
      handle.classList.contains('nw') ? 'nw' :
      handle.classList.contains('ne') ? 'ne' :
      handle.classList.contains('sw') ? 'sw' : 'se';

    handle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      startCropResize(e, frame, type);
    });
  });

  const applyBtn = frame.querySelector('.crop-apply');
  const cancelBtn = frame.querySelector('.crop-cancel');
  if (applyBtn) {
    applyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      applyCrop(frame);
    });
  }
  if (cancelBtn) {
    cancelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      cancelCrop(frame);
    });
  }

  frame.querySelector('.tool-duplicate').addEventListener('click', (e) => {
    e.stopPropagation();
    pushUndo();
    duplicateFrame(frame);
  });

  frame.querySelector('.tool-delete').addEventListener('click', (e) => {
    e.stopPropagation();
    pushUndo();
    frame.remove();
    persistAll();
  });

  const textEl = frame.querySelector('.text-content');
  if (textEl) {
    textEl.addEventListener('blur', () => exitEditMode(frame, textEl));
    textEl.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      pushUndo();
      enterEditMode(frame, textEl);
    });
    textEl.addEventListener('pointerdown', (e) => {
      if (textEl.classList.contains('editing')) e.stopPropagation();
    });
  }
}

function enterEditMode(frame, textEl) {
  selectFrame(frame);
  frame.classList.add('editing-frame');
  textEl.classList.add('editing');
  textEl.setAttribute('contenteditable', 'true');
  textEl.focus();
  const range = document.createRange();
  range.selectNodeContents(textEl);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function exitEditMode(frame, textEl) {
  frame.classList.remove('editing-frame');
  textEl.classList.remove('editing');
  textEl.setAttribute('contenteditable', 'false');
  if (textEl.textContent.trim() === '') {
    frame.remove();
  }
  persistAll();
}

function selectFrame(frame) {
  document.querySelectorAll('.frame.selected').forEach(f => {
    if (f !== frame) f.classList.remove('selected');
  });
  frame.classList.add('selected');
  frame.style.zIndex = ++zIndexCounter;
}

/* ===== 移動（ノート内部座標系で計算） ===== */
function startMove(e, frame) {
  const startPt = screenToNotebook(e.clientX, e.clientY);
  const startLeft = parseFloat(frame.style.left);
  const startTop = parseFloat(frame.style.top);
  frame.setPointerCapture(e.pointerId);
  frame.style.cursor = 'grabbing';

  function onMove(ev) {
    const pt = screenToNotebook(ev.clientX, ev.clientY);
    frame.style.left = (startLeft + (pt.x - startPt.x)) + 'px';
    frame.style.top = (startTop + (pt.y - startPt.y)) + 'px';
  }
  function onUp() {
    activeFrameDragEnd = null;
    frame.style.cursor = 'grab';
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    frame.removeEventListener('pointercancel', onUp);
    frame.removeEventListener('lostpointercapture', onUp);
    persistAll();
  }
  activeFrameDragEnd = onUp;
  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
  frame.addEventListener('pointercancel', onUp);
  frame.addEventListener('lostpointercapture', onUp);
}

/* ============================================================
   拡大縮小：掴んだ頂点の対角を固定点として拡縮（ノート内部座標系）
   ============================================================ */
function startResize(e, frame, handleType) {
  e.preventDefault();

  const w = parseFloat(frame.style.width);
  const h = parseFloat(frame.style.height);
  const startFrameScale = parseFloat(frame.dataset.scale) || 1;
  const angle = (parseFloat(frame.dataset.angle) || 0) * Math.PI / 180;
  const cosA = Math.cos(angle), sinA = Math.sin(angle);

  const frameLeft = parseFloat(frame.style.left);
  const frameTop = parseFloat(frame.style.top);
  const cx = frameLeft + w / 2;
  const cy = frameTop + h / 2;

  const hw = w / 2, hh = h / 2;

  let anchorBase;
  switch (handleType) {
    case 'nw': anchorBase = { x:  hw, y:  hh }; break;
    case 'ne': anchorBase = { x: -hw, y:  hh }; break;
    case 'sw': anchorBase = { x:  hw, y: -hh }; break;
    case 'se': anchorBase = { x: -hw, y: -hh }; break;
  }

  const anchorX = cx + (anchorBase.x * cosA - anchorBase.y * sinA) * startFrameScale;
  const anchorY = cy + (anchorBase.x * sinA + anchorBase.y * cosA) * startFrameScale;

  const diffBaseX = -2 * anchorBase.x;
  const diffBaseY = -2 * anchorBase.y;
  const diffBaseLen = Math.hypot(diffBaseX, diffBaseY);
  const unitX = diffBaseX / diffBaseLen;
  const unitY = diffBaseY / diffBaseLen;

  frame.setPointerCapture(e.pointerId);

  function onMove(ev) {
    const pt = screenToNotebook(ev.clientX, ev.clientY);
    const vecX = pt.x - anchorX;
    const vecY = pt.y - anchorY;

    const vecLocalX = vecX * cosA + vecY * sinA;
    const vecLocalY = -vecX * sinA + vecY * cosA;

    const projLen = vecLocalX * unitX + vecLocalY * unitY;
    let newScale = projLen / diffBaseLen;
    newScale = Math.max(0.2, Math.min(6, newScale));

    const newCenterX = anchorX - (anchorBase.x * cosA - anchorBase.y * sinA) * newScale;
    const newCenterY = anchorY - (anchorBase.x * sinA + anchorBase.y * cosA) * newScale;

    frame.dataset.scale = newScale;
    frame.style.left = (newCenterX - hw) + 'px';
    frame.style.top  = (newCenterY - hh) + 'px';

    applyTransform(frame);
  }
  function onUp() {
    activeFrameDragEnd = null;
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    frame.removeEventListener('pointercancel', onUp);
    frame.removeEventListener('lostpointercapture', onUp);
    persistAll();
  }
  activeFrameDragEnd = onUp;
  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
  frame.addEventListener('pointercancel', onUp);
  frame.addEventListener('lostpointercapture', onUp);
}

function startRotate(e, frame) {
  const w = parseFloat(frame.style.width);
  const h = parseFloat(frame.style.height);
  const frameLeft = parseFloat(frame.style.left);
  const frameTop = parseFloat(frame.style.top);
  const cx = frameLeft + w / 2;
  const cy = frameTop + h / 2;

  const startAngle = parseFloat(frame.dataset.angle) || 0;
  const startPt = screenToNotebook(e.clientX, e.clientY);
  const startPointerAngle = Math.atan2(startPt.y - cy, startPt.x - cx) * 180 / Math.PI;

  frame.setPointerCapture(e.pointerId);

  function onMove(ev) {
    const pt = screenToNotebook(ev.clientX, ev.clientY);
    const pointerAngle = Math.atan2(pt.y - cy, pt.x - cx) * 180 / Math.PI;
    const newAngle = startAngle + (pointerAngle - startPointerAngle);
    frame.dataset.angle = newAngle;
    applyTransform(frame);
  }
  function onUp() {
    activeFrameDragEnd = null;
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    frame.removeEventListener('pointercancel', onUp);
    frame.removeEventListener('lostpointercapture', onUp);
    persistAll();
  }
  activeFrameDragEnd = onUp;
  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
  frame.addEventListener('pointercancel', onUp);
  frame.addEventListener('lostpointercapture', onUp);
}

function applyTransform(frame) {
  const angle = parseFloat(frame.dataset.angle) || 0;
  const scale = parseFloat(frame.dataset.scale) || 1;
  frame.style.transform = `rotate(${angle}deg) scale(${scale})`;

  const toolbar = frame.querySelector('.toolbar');
  if (toolbar) {
    toolbar.style.transform = `translate(-50%, 10px) rotate(${-angle}deg) scale(${1 / scale})`;
  }

  const cropControls = frame.querySelector('.crop-controls');
  if (cropControls) {
    cropControls.style.transform = `rotate(${-angle}deg) scale(${1 / scale})`;
  }

  frame.querySelectorAll('.handle').forEach(h => {
    h.style.transform = `scale(${1 / scale})`;
  });
}

function duplicateFrame(frame) {
  const clone = frame.cloneNode(true);
  clone.style.left = (parseFloat(frame.style.left) + 20) + 'px';
  clone.style.top = (parseFloat(frame.style.top) + 20) + 'px';
  clone.classList.remove('selected', 'editing-frame', 'cropping');

  const textEl = clone.querySelector('.text-content');
  if (textEl) {
    textEl.classList.remove('editing');
    textEl.setAttribute('contenteditable', 'false');
  }

  notebook.appendChild(clone);
  initFrame(clone);
  selectFrame(clone);
  applyTransform(clone);
  persistAll();
}

/* ============================================================
   インライントリミング機能
   ============================================================ */
function startCrop(frame) {
  const img = frame.querySelector('img');
  if (!img) return;

  pushUndo();

  croppingFrame = frame;
  frame.classList.add('cropping');
  frame.classList.remove('selected');

  const w = parseFloat(frame.style.width);
  const h = parseFloat(frame.style.height);
  const cropW = w * 0.8;
  const cropH = h * 0.8;
  const cropX = w * 0.1;
  const cropY = h * 0.1;

  cropStartData = {
    originalSrc: img.src,
    frameWidth: w,
    frameHeight: h,
    cropX: cropX,
    cropY: cropY,
    cropW: cropW,
    cropH: cropH
  };

  updateCropMask(frame);
}

function updateCropMask(frame) {
  const data = cropStartData;
  if (!data) return;

  const maskTop = frame.querySelector('.crop-mask-top');
  const maskBottom = frame.querySelector('.crop-mask-bottom');
  const maskLeft = frame.querySelector('.crop-mask-left');
  const maskRight = frame.querySelector('.crop-mask-right');
  const cropArea = frame.querySelector('.crop-area');

  maskTop.style.height = data.cropY + 'px';
  maskBottom.style.height = (data.frameHeight - data.cropY - data.cropH) + 'px';

  maskLeft.style.top = data.cropY + 'px';
  maskLeft.style.height = data.cropH + 'px';
  maskLeft.style.width = data.cropX + 'px';

  maskRight.style.top = data.cropY + 'px';
  maskRight.style.height = data.cropH + 'px';
  maskRight.style.left = (data.cropX + data.cropW) + 'px';
  maskRight.style.width = (data.frameWidth - data.cropX - data.cropW) + 'px';

  cropArea.style.left = data.cropX + 'px';
  cropArea.style.top = data.cropY + 'px';
  cropArea.style.width = data.cropW + 'px';
  cropArea.style.height = data.cropH + 'px';
}

function startCropMove(e, frame) {
  const data = cropStartData;
  if (!data) return;

  const frameScale = parseFloat(frame.dataset.scale) || 1;
  const totalScale = getViewScale() * frameScale;

  const startX = e.clientX;
  const startY = e.clientY;
  const startCropX = data.cropX;
  const startCropY = data.cropY;

  const cropArea = frame.querySelector('.crop-area');
  cropArea.setPointerCapture(e.pointerId);

  function onMove(ev) {
    const dx = (ev.clientX - startX) / totalScale;
    const dy = (ev.clientY - startY) / totalScale;

    data.cropX = Math.max(0, Math.min(startCropX + dx, data.frameWidth - data.cropW));
    data.cropY = Math.max(0, Math.min(startCropY + dy, data.frameHeight - data.cropH));

    updateCropMask(frame);
  }

  function onUp() {
    cropArea.removeEventListener('pointermove', onMove);
    cropArea.removeEventListener('pointerup', onUp);
    cropArea.removeEventListener('pointercancel', onUp);
    cropArea.removeEventListener('lostpointercapture', onUp);
  }

  cropArea.addEventListener('pointermove', onMove);
  cropArea.addEventListener('pointerup', onUp);
  cropArea.addEventListener('pointercancel', onUp);
  cropArea.addEventListener('lostpointercapture', onUp);
}

function startCropResize(e, frame, handleType) {
  e.preventDefault();

  const data = cropStartData;
  if (!data) return;

  const frameScale = parseFloat(frame.dataset.scale) || 1;
  const totalScale = getViewScale() * frameScale;

  const startX = e.clientX;
  const startY = e.clientY;
  const startCropX = data.cropX;
  const startCropY = data.cropY;
  const startCropW = data.cropW;
  const startCropH = data.cropH;

  const handle = e.target;
  handle.setPointerCapture(e.pointerId);

  function onMove(ev) {
    const dx = (ev.clientX - startX) / totalScale;
    const dy = (ev.clientY - startY) / totalScale;

    switch (handleType) {
      case 'nw':
        data.cropX = Math.max(0, Math.min(startCropX + dx, startCropX + startCropW - 20));
        data.cropY = Math.max(0, Math.min(startCropY + dy, startCropY + startCropH - 20));
        data.cropW = startCropW - (data.cropX - startCropX);
        data.cropH = startCropH - (data.cropY - startCropY);
        break;
      case 'ne':
        data.cropY = Math.max(0, Math.min(startCropY + dy, startCropY + startCropH - 20));
        data.cropW = Math.max(20, Math.min(startCropW + dx, data.frameWidth - startCropX));
        data.cropH = startCropH - (data.cropY - startCropY);
        break;
      case 'sw':
        data.cropX = Math.max(0, Math.min(startCropX + dx, startCropX + startCropW - 20));
        data.cropW = startCropW - (data.cropX - startCropX);
        data.cropH = Math.max(20, Math.min(startCropH + dy, data.frameHeight - startCropY));
        break;
      case 'se':
        data.cropW = Math.max(20, Math.min(startCropW + dx, data.frameWidth - startCropX));
        data.cropH = Math.max(20, Math.min(startCropH + dy, data.frameHeight - startCropY));
        break;
    }

    updateCropMask(frame);
  }

  function onUp() {
    handle.removeEventListener('pointermove', onMove);
    handle.removeEventListener('pointerup', onUp);
    handle.removeEventListener('pointercancel', onUp);
    handle.removeEventListener('lostpointercapture', onUp);
  }

  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', onUp);
  handle.addEventListener('pointercancel', onUp);
  handle.addEventListener('lostpointercapture', onUp);
}

function applyCrop(frame) {
  const img = frame.querySelector('img');
  const data = cropStartData;
  if (!img || !data) return;

  const canvas = document.createElement('canvas');
  const cctx = canvas.getContext('2d');

  const tempImg = new Image();
  tempImg.onload = () => {
    const scaleX = tempImg.naturalWidth / data.frameWidth;
    const scaleY = tempImg.naturalHeight / data.frameHeight;

    const srcX = data.cropX * scaleX;
    const srcY = data.cropY * scaleY;
    const srcW = data.cropW * scaleX;
    const srcH = data.cropH * scaleY;

    canvas.width = srcW;
    canvas.height = srcH;

    cctx.drawImage(tempImg, srcX, srcY, srcW, srcH, 0, 0, srcW, srcH);

    img.src = canvas.toDataURL('image/png');

    frame.style.width = data.cropW + 'px';
    frame.style.height = data.cropH + 'px';
    frame.style.left = (parseFloat(frame.style.left) + data.cropX) + 'px';
    frame.style.top = (parseFloat(frame.style.top) + data.cropY) + 'px';

    frame.classList.remove('cropping');
    frame.classList.add('selected');
    croppingFrame = null;
    cropStartData = null;

    persistAll();
  };
  tempImg.src = data.originalSrc;
}

function cancelCrop(frame) {
  frame.classList.remove('cropping');
  frame.classList.add('selected');
  croppingFrame = null;
  cropStartData = null;
}
</script>
