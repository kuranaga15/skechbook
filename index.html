/* 2本指ピンチズーム・パン */
const touchPointers = new Map();
let isPinching = false;
let pinchStartDist = 0;
let pinchStartUserScale = 1;
let pinchStartMid = { x: 0, y: 0 };
let pinchStartPan = { x: 0, y: 0 };
let activeFrameDragEnd = null;
/* 二本指タップで戻る: ピンチ開始時の時刻・動きを記録する */
let pinchStartTime = 0;
let pinchMaxDistDelta = 0;
let pinchMaxMidMove = 0;
let pinchStartedOnStage = false;
/* ズームの起点をピンチ位置に合わせるための開始時スナップショット */
let pinchStartTotalScale = 1;
let pinchStartCenter = { x: 0, y: 0 };

function distOf(p1, p2) { return Math.hypot(p2.x - p1.x, p2.y - p1.y); }
function midOf(p1, p2) { return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }; }

window.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch' || spreadEditMode) return;
  touchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY, onStage: !!(e.target && e.target.closest && e.target.closest('#stage')) });
  if (touchPointers.size === 2) {
    const pts = [...touchPointers.values()];
    pinchStartDist = distOf(pts[0], pts[1]) || 1;
    pinchStartUserScale = bookUserScale;
    pinchStartMid = midOf(pts[0], pts[1]);
    pinchStartPan = { x: panX, y: panY };
    pinchStartTime = performance.now();
    pinchMaxDistDelta = 0;
    pinchMaxMidMove = 0;
    pinchStartedOnStage = !!(pts[0].onStage && pts[1].onStage);
    pinchStartTotalScale = getViewScale();
    const stageRect = stage.getBoundingClientRect();
    pinchStartCenter = { x: stageRect.left + stageRect.width / 2, y: stageRect.top + stageRect.height / 2 };
    isPinching = true;
    if (isDrawing) {
      const elapsedSinceStroke = performance.now() - currentStrokeStartTime;
      if (elapsedSinceStroke < ACCIDENTAL_STROKE_MS) {
        cancelStrokeAsAccidental();
      } else {
        endStroke();
      }
    }
    if (activeFrameDragEnd) { const fn = activeFrameDragEnd; activeFrameDragEnd = null; fn(); }
  }
}, { capture: true });

window.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'touch' || spreadEditMode) return;
  if (!touchPointers.has(e.pointerId)) return;
  touchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (isPinching && touchPointers.size === 2) {
    if (e.cancelable) e.preventDefault();
    const pts = [...touchPointers.values()];
    const newDist = distOf(pts[0], pts[1]);
    const newMid = midOf(pts[0], pts[1]);
    pinchMaxDistDelta = Math.max(pinchMaxDistDelta, Math.abs(newDist - pinchStartDist));
    pinchMaxMidMove = Math.max(pinchMaxMidMove, Math.hypot(newMid.x - pinchStartMid.x, newMid.y - pinchStartMid.y));
    const scaleFactor = newDist / pinchStartDist;
    bookUserScale = clamp(pinchStartUserScale * scaleFactor, MIN_USER_SCALE, MAX_USER_SCALE);
    /* ズームの起点はピンチの中心: 開始時に指の下にあった場所が、拡縮しても
       指の下に残るよう pan を逆算する (以前はノート中心で拡縮していたため、
       端でピンチすると中身が外側へ流れたり中心へ寄ったりした) */
    const ratio = (bookBaseScale * bookUserScale) / pinchStartTotalScale;
    panX = (newMid.x - pinchStartCenter.x) - (pinchStartMid.x - pinchStartCenter.x - pinchStartPan.x) * ratio;
    panY = (newMid.y - pinchStartCenter.y) - (pinchStartMid.y - pinchStartCenter.y - pinchStartPan.y) * ratio;
    applyZoomTransform();
  }
}, { capture: true, passive: false });

function releaseTouchPointer(e) {
  if (e.pointerType !== 'touch') return;
  const wasPinching = isPinching;
  touchPointers.delete(e.pointerId);
  if (touchPointers.size === 0) {
    isPinching = false;
    clampPan();
    applyZoomTransform();
    /* 二本指タップで戻る: 2本ともほぼ動かず短時間で離れたら undo() */
    if (wasPinching && pinchStartedOnStage) {
      const tapDuration = performance.now() - pinchStartTime;
      if (tapDuration <= 350 && pinchMaxDistDelta <= 12 && pinchMaxMidMove <= 12) {
        undo();
      }
    }
  }
}
window.addEventListener('pointerup', releaseTouchPointer, { capture: true });
window.addEventListener('pointercancel', releaseTouchPointer, { capture: true });

/* ============================================================
   見開きモードのピンチズーム
   通常モードのピンチは zoomLayer を操作するが、見開きではノート本体が
   別要素に移っていて transform も専用管理のため、こちらで処理する。
   指の下にある場所が指の下に残るよう、ピンチ開始時の位置を基準にする。
   ============================================================ */
const spreadTouchPointers = new Map();
let spreadPinching = false;
let spreadPinchStartDist = 0;
let spreadPinchStartZoom = 1;
let spreadPinchAnchorX = 0, spreadPinchAnchorY = 0;
let spreadPinchOriginX = 0, spreadPinchOriginY = 0;

function applySpreadTransform() {
  const scale = (SPREAD_PAGE_W / BOOK_W) * spreadZoom;
  notebook.style.transform = `translate(${spreadPanX}px, ${spreadPanY}px) scale(${scale})`;
}

function clampSpreadPan() {
  const s = (SPREAD_PAGE_W / BOOK_W) * spreadZoom;
  const w = BOOK_W * s, h = BOOK_H * s;
  spreadPanX = clamp(spreadPanX, Math.min(0, SPREAD_PAGE_W - w), Math.max(0, SPREAD_PAGE_W - w));
  spreadPanY = clamp(spreadPanY, Math.min(0, SPREAD_PAGE_H - h), Math.max(0, SPREAD_PAGE_H - h));
}

window.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch' || !spreadEditMode) return;
  spreadTouchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (spreadTouchPointers.size !== 2) return;

  if (isDrawing) {
    if (performance.now() - currentStrokeStartTime < ACCIDENTAL_STROKE_MS) cancelStrokeAsAccidental();
    else endStroke();
  }
  if (activeFrameDragEnd) { const fn = activeFrameDragEnd; activeFrameDragEnd = null; fn(); }

  const pts = [...spreadTouchPointers.values()];
  spreadPinching = true;
  spreadPinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  const midX = (pts[0].x + pts[1].x) / 2;
  const midY = (pts[0].y + pts[1].y) / 2;
  spreadPinchStartZoom = spreadZoom;
  const rect = notebook.getBoundingClientRect();
  spreadPinchAnchorX = midX - rect.left;
  spreadPinchAnchorY = midY - rect.top;
  spreadPinchOriginX = rect.left - spreadPanX;
  spreadPinchOriginY = rect.top - spreadPanY;
}, true);

window.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'touch' || !spreadEditMode) return;
  if (!spreadTouchPointers.has(e.pointerId)) return;
  spreadTouchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!spreadPinching || spreadTouchPointers.size !== 2) return;

  const pts = [...spreadTouchPointers.values()];
  const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  const midX = (pts[0].x + pts[1].x) / 2;
  const midY = (pts[0].y + pts[1].y) / 2;
  if (spreadPinchStartDist > 0) {
    spreadZoom = clamp(spreadPinchStartZoom * (dist / spreadPinchStartDist), 0.3, 6);
  }
  const ratio = spreadZoom / spreadPinchStartZoom;
  spreadPanX = (midX - spreadPinchOriginX) - spreadPinchAnchorX * ratio;
  spreadPanY = (midY - spreadPinchOriginY) - spreadPinchAnchorY * ratio;
  clampSpreadPan();
  applySpreadTransform();
  if (e.cancelable) e.preventDefault();
}, true);

function spreadTouchPointerEnd(e) {
  if (e.pointerType !== 'touch') return;
  spreadTouchPointers.delete(e.pointerId);
  if (spreadTouchPointers.size < 2) spreadPinching = false;
}
window.addEventListener('pointerup', spreadTouchPointerEnd, true);
window.addEventListener('pointercancel', spreadTouchPointerEnd, true);

stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = -e.deltaY * 0.0015;
  bookUserScale = clamp(bookUserScale * (1 + delta), MIN_USER_SCALE, MAX_USER_SCALE);
  applyZoomTransform();
}, { passive: false });

stage.addEventListener('dblclick', (e) => {
  if (e.target.closest('.frame')) return;
  bookUserScale = 1;
  panX = 0; panY = 0;
  applyZoomTransform();
});
/* ============================================================
   中クリック(ホイールクリック)ドラッグでパン（3Dソフト風の操作感）
   ============================================================ */
let isMiddlePanning = false;
let middlePanStart = { x: 0, y: 0 };
let middlePanStartPan = { x: 0, y: 0 };

// 中ボタンを押した瞬間、ブラウザ標準のオートスクロールカーソルが出るのを防ぐ
window.addEventListener('mousedown', (e) => {
  if (e.button === 1) e.preventDefault();
});

window.addEventListener('pointerdown', (e) => {
  if (e.button !== 1) return;
  if (spreadEditMode) return; // 見開き編集中はパン対象が別要素になるため無効化
  e.preventDefault();
  isMiddlePanning = true;
  middlePanStart = { x: e.clientX, y: e.clientY };
  middlePanStartPan = { x: panX, y: panY };
  document.body.style.cursor = 'grabbing';
});

window.addEventListener('pointermove', (e) => {
  if (!isMiddlePanning) return;
  e.preventDefault();
  panX = middlePanStartPan.x + (e.clientX - middlePanStart.x);
  panY = middlePanStartPan.y + (e.clientY - middlePanStart.y);
  applyZoomTransform();
});

function endMiddlePan(e) {
  if (!isMiddlePanning) return;
  isMiddlePanning = false;
  document.body.style.cursor = '';
  clampPan();
  applyZoomTransform();
}
window.addEventListener('pointerup', endMiddlePan);
window.addEventListener('pointercancel', endMiddlePan);
/* ============================================================
   Undo
   ============================================================ */
const MAX_UNDO = 25;
let undoStack = [];

function snapshotStateString() {
  pages[currentIndex].frames = collectFramesFromDOM();
  return JSON.stringify({ pages, currentIndex });
}

function pushUndo() {
  undoStack.push(snapshotStateString());
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  updateUndoButtonState();
}

function undo() {
  if (undoStack.length === 0) return;
  const snapshot = JSON.parse(undoStack.pop());
  pages = snapshot.pages;
  currentIndex = Math.min(snapshot.currentIndex, pages.length - 1);
  renderPage(currentIndex);

  idbSet(STORAGE_KEY, { currentIndex, pages }).catch(() => {});
  renderThumbnails();
  updateUndoButtonState();
}

function updateUndoButtonState() {
  undoBtn.classList.toggle('disabled', undoStack.length === 0);
}

undoBtn.addEventListener('click', () => undo());

document.addEventListener('keydown', (e) => {
  const isUndoKey = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z';
  if (!isUndoKey) return;

  const active = document.activeElement;
  if (active && active.classList.contains('text-content') && active.classList.contains('editing')) {
    return;
  }
  e.preventDefault();
  undo();
});

/* ============================================================
   画像インポート
   ============================================================ */
importImageBtn.addEventListener('click', () => {
  imageImportInput.value = '';
  imageImportInput.click();
});

imageImportInput.addEventListener('change', (e) => {
  const files = [...e.target.files];
  if (!files.length) return;

  const centerX = BOOK_W / 2;
  const centerY = BOOK_H / 2;

  files.forEach((file, i) => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const offset = i * 24;
      createImageFrame(ev.target.result, centerX + offset, centerY + offset);
    };
    reader.readAsDataURL(file);
  });
});

/* ============================================================
   JSONエクスポート／インポート
   ============================================================ */
function pad2(n) { return String(n).padStart(2, '0'); }

exportBtn.addEventListener('click', () => {
  pages[currentIndex].frames = collectFramesFromDOM();
  pages[currentIndex].drawing = drawCanvas.toDataURL('image/png');

  const exportData = {
    formatVersion: 3,
    exportedAt: new Date().toISOString(),
    currentIndex,
    pages
  };

  let jsonStr;
  try {
    jsonStr = JSON.stringify(exportData);
  } catch (e) {
    alert('書き出しに失敗しました。データが大きすぎる可能性があります。');
    return;
  }

  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);

  const now = new Date();
  const fname = `sketchbook-${now.getFullYear()}${pad2(now.getMonth()+1)}${pad2(now.getDate())}-${pad2(now.getHours())}${pad2(now.getMinutes())}.json`;

  const a = document.createElement('a');
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

importBtn.addEventListener('click', () => {
  jsonImportInput.value = '';
  jsonImportInput.click();
});

jsonImportInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (ev) => {
    let data;
    try {
      data = JSON.parse(ev.target.result);
    } catch (err) {
      alert('このファイルは正しいJSON形式ではありません。');
      return;
    }

    if (!data || !Array.isArray(data.pages) || data.pages.length === 0) {
      alert('スケッチブックのデータとして認識できませんでした。');
      return;
    }

    const ok = confirm('読み込むと今のノートの内容は上書きされます。よろしいですか？\n（読み込み後は元に戻すボタンで復元できます）');
    if (!ok) return;

    pushUndo();

    pages = data.pages;
    currentIndex = Math.min(data.currentIndex || 0, pages.length - 1);

    renderPage(currentIndex);
    persistAll();
    alert('読み込みが完了しました。');
  };
  reader.onerror = () => {
    alert('ファイルの読み込みに失敗しました。');
  };
  reader.readAsText(file);
});

/* ============================================================
   モード切替
   ============================================================ */
function setMode(newMode) {
  mode = newMode;
  modeSelectBtn.classList.toggle('active', mode === 'select');
  modePenBtn.classList.toggle('active', mode === 'pen');
  modeEraserBtn.classList.toggle('active', mode === 'eraser');
  notebook.classList.toggle('drawing-mode', mode !== 'select');
  notebook.classList.toggle('erasing-mode', mode === 'eraser');

  if (mode !== 'select') {
    document.querySelectorAll('.frame.selected').forEach(f => f.classList.remove('selected'));
    removeAddTextButton();
  }

  updateSizeUIForMode();
}

function updateSizeUIForMode() {
  penSizeInput.value = (mode === 'eraser') ? currentEraserSize : currentPenSize;
  updatePenSizePresetActive();
}
modeSelectBtn.addEventListener('click', () => setMode('select'));
modePenBtn.addEventListener('click', () => setMode('pen'));
modeEraserBtn.addEventListener('click', () => setMode('eraser'));

/* ============================================================
   手書き描画処理
   ============================================================ */
let isDrawing = false;
let activePointerId = null;
let lastX = 0, lastY = 0;
let currentStrokeStartTime = 0;
let strokeTraveledDist = 0;
let lastMoveTime = 0;
let smoothedSpeed = 0;

const PEN_BLOB_SCALE = 1.55;
const PEN_TAPER_DIST = 11 * CANVAS_SCALE;

function widthMultiplierAt(dist) {
  if (dist >= PEN_TAPER_DIST) return 1;
  const t = dist / PEN_TAPER_DIST;
  const eased = 1 - Math.pow(1 - t, 2);
  return PEN_BLOB_SCALE - (PEN_BLOB_SCALE - 1) * eased;
}

const SPEED_THIN_START   = 0.05 * CANVAS_SCALE;
const SPEED_THIN_MAX      = 1.6 * CANVAS_SCALE;
const SPEED_THIN_FLOOR    = 0.72;
const SPEED_OPACITY_FLOOR = 0.5;

function speedEaseFactor(speed) {
  if (speed <= SPEED_THIN_START) return 0;
  const t = Math.min(1, (speed - SPEED_THIN_START) / (SPEED_THIN_MAX - SPEED_THIN_START));
  return t * t;
}
function speedWidthMultiplier(easeT) {
  return 1 - easeT * (1 - SPEED_THIN_FLOOR);
}
function speedOpacityMultiplier(easeT) {
  return 1 - easeT * (1 - SPEED_OPACITY_FLOOR);
}

function hexToRgba(hex, alpha) {
  const h = (hex || '#1a1a1a').replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const num = parseInt(full, 16) || 0;
  const r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function drawPenBlob(x, y, radius) {
  const color = penColorInput.value;
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
  grad.addColorStop(0, color);
  grad.addColorStop(0.65, color);
  grad.addColorStop(1, hexToRgba(color, 0));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

const ACCIDENTAL_STROKE_MS = 220;

function canvasPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

drawCanvas.addEventListener('pointerdown', (e) => {
  if (mode === 'select') return;
  if (isPinching) return;
  if (isDrawing) {
    /* 描いている途中で2本目の指が触れたら、ジェスチャーが始まったものとして
       線をここで終える。見開きモードではピンチ判定が働かないため、ここで
       止めないと2本の指の動きの間でペンが暴れてしまう。 */
    if (e.cancelable) e.preventDefault();
    if (performance.now() - currentStrokeStartTime < ACCIDENTAL_STROKE_MS) {
      cancelStrokeAsAccidental();
    } else {
      endStroke();
    }
    return;
  }
  if (e.cancelable) e.preventDefault();
  pushUndo();
  isDrawing = true;
  activePointerId = e.pointerId;
  currentStrokeStartTime = performance.now();
  strokeTraveledDist = 0;
  lastMoveTime = currentStrokeStartTime;
  smoothedSpeed = 0;
  const p = canvasPos(e);
  lastX = p.x; lastY = p.y;
  drawCanvas.setPointerCapture(e.pointerId);

  applyStrokeStyle();
  if (mode === 'pen') {
    drawPenBlob(p.x, p.y, (getPenSize() / 2) * PEN_BLOB_SCALE * CANVAS_SCALE);
  } else {
    ctx.beginPath();
    ctx.arc(p.x, p.y, (getEraserSize() / 2) * CANVAS_SCALE, 0, Math.PI * 2);
    ctx.fill();
  }
}, { passive: false });

drawCanvas.addEventListener('pointermove', (e) => {
  if (!isDrawing || e.pointerId !== activePointerId) return;
  if (e.cancelable) e.preventDefault();
  const p = canvasPos(e);
  const segLen = Math.hypot(p.x - lastX, p.y - lastY);
  const segStartDist = strokeTraveledDist;
  strokeTraveledDist += segLen;

  const now = performance.now();
  const dt = Math.max(1, now - lastMoveTime);
  const instSpeed = segLen / dt;
  smoothedSpeed = smoothedSpeed * 0.65 + instSpeed * 0.35;
  lastMoveTime = now;

  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  applyStrokeStyle();

  if (mode === 'pen') {
    const taperMult = widthMultiplierAt(segStartDist + segLen / 2);
    const easeT = speedEaseFactor(smoothedSpeed);
    const speedMult = speedWidthMultiplier(easeT);
    ctx.lineWidth = getPenSize() * taperMult * speedMult * CANVAS_SCALE;
    ctx.globalAlpha = speedOpacityMultiplier(easeT);
  }

  ctx.stroke();
  ctx.globalAlpha = 1;
  lastX = p.x; lastY = p.y;
}, { passive: false });

function cancelStrokeAsAccidental() {
  if (!isDrawing) return;
  isDrawing = false;
  activePointerId = null;
  if (undoStack.length) {
    undoStack.pop();
    updateUndoButtonState();
  }
  loadDrawingIntoCanvas(pages[currentIndex] ? pages[currentIndex].drawing : null);
}

function endStroke() {
  if (!isDrawing) return;
  isDrawing = false;
  activePointerId = null;
  if (mode === 'pen') {
    drawPenBlob(lastX, lastY, (getPenSize() / 2) * PEN_BLOB_SCALE * CANVAS_SCALE);
  }
  persistDrawing();
}
function endStrokeFromEvent(e) {
  if (activePointerId !== null && e.pointerId !== activePointerId) return;
  endStroke();
}
drawCanvas.addEventListener('pointerup', endStrokeFromEvent);
drawCanvas.addEventListener('pointerleave', endStrokeFromEvent);
drawCanvas.addEventListener('pointercancel', endStrokeFromEvent);

let currentPenSize = 1;
let currentEraserSize = 12;

function getPenSize() { return currentPenSize; }
function getEraserSize() { return currentEraserSize; }

/* ペンと消しゴムの太さを端末に記憶し、リロードしても前回の太さで始める。
   初期値はペンが最小の1 (保存済みの値があればそちらを優先)。 */
const PEN_SIZE_STORAGE_KEY = 'sketchbook-pen-sizes';
function savePenSizes() {
  try {
    localStorage.setItem(PEN_SIZE_STORAGE_KEY, JSON.stringify({ pen: currentPenSize, eraser: currentEraserSize }));
  } catch (e) { /* 保存できなくても描画には影響しない */ }
}
(function restorePenSizes() {
  try {
    const raw = localStorage.getItem(PEN_SIZE_STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      const pen = parseFloat(saved.pen);
      const eraser = parseFloat(saved.eraser);
      if (Number.isFinite(pen)) currentPenSize = clamp(pen, 1, 40);
      if (Number.isFinite(eraser)) currentEraserSize = clamp(eraser, 1, 40);
    }
  } catch (e) { /* 読めなければ初期値のまま */ }
  updateSizeUIForMode();
})();

function applyStrokeStyle() {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (mode === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = getEraserSize() * CANVAS_SCALE;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = penColorInput.value;
    ctx.fillStyle = penColorInput.value;
    ctx.lineWidth = getPenSize() * CANVAS_SCALE;
  }
}

clearDrawBtn.addEventListener('click', () => {
  const ok = confirm('このページの手書きをすべて消しますか？');
  if (!ok) return;
  pushUndo();
  ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  persistDrawing();
});

function persistDrawing() {
  pages[currentIndex].drawing = drawCanvas.toDataURL('image/png');
  persistAll();
}

let drawingLoadSeq = 0;
function loadDrawingIntoCanvas(dataUrl) {
  /* 消しゴム使用後は ctx.globalCompositeOperation が 'destination-out' に
     残ったままになることがあり、その状態で drawImage すると画像を描く代わりに
     キャンバスを消してしまう。読み込み時は必ず 'source-over' に戻す。 */
  const seq = ++drawingLoadSeq;
  if (!dataUrl) {
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    ctx.restore();
    return;
  }
  const img = new Image();
  img.onload = () => {
    if (seq !== drawingLoadSeq) return;
    /* 先に消してから画像を読み込むと、読み込み完了までの間キャンバスが
       空になり描画が一瞬消えて見える。画像の用意ができてから、消去と
       描画を同じフレームでまとめて行う。 */
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    ctx.drawImage(img, 0, 0, drawCanvas.width, drawCanvas.height);
    ctx.restore();
  };
  img.src = dataUrl;
}

/* ============================================================
   保存・復元
   ============================================================ */
function frameElementToData(frame) {
  const isText = !!frame.querySelector('.text-content');
  return {
    type: isText ? 'text' : 'image',
    src: isText ? null : frame.querySelector('img').src,
    text: isText ? frame.querySelector('.text-content').innerText : null,
    left: parseFloat(frame.style.left),
    top: parseFloat(frame.style.top),
    w: parseFloat(frame.style.width),
    h: parseFloat(frame.style.height),
    angle: parseFloat(frame.dataset.angle) || 0,
    scale: parseFloat(frame.dataset.scale) || 1,
    z: parseInt(frame.style.zIndex) || 20
  };
}

function collectFramesFromDOM() {
  return [...notebook.querySelectorAll('.frame')].map(frameElementToData);
}

function persistAll() {
  pages[currentIndex].frames = collectFramesFromDOM();
  const snapshot = { currentIndex, pages };
  idbSet(STORAGE_KEY, snapshot).catch((e) => {
    console.warn('保存に失敗しました', e);
    alert('保存に失敗しました。ブラウザやパソコンの空き容量を確認してください。');
  });
  renderThumbnails();
}

async function restoreAll() {
  try {
    const data = await idbGet(STORAGE_KEY);
    if (data && Array.isArray(data.pages) && data.pages.length > 0) {
      pages = data.pages;
      currentIndex = Math.min(data.currentIndex || 0, pages.length - 1);
      return;
    }
  } catch (e) { /* ignore */ }
  pages = [{ frames: [], drawing: null }];
  currentIndex = 0;
}

window.addEventListener('DOMContentLoaded', async () => {
  await restoreAll();
  applyLayoutMode();
  renderPage(currentIndex);
  renderThumbnails();
  updateUndoButtonState();
  updateSizeUIForMode();
});

/* ============================================================
   ページ描画・ページめくり
   ============================================================ */
function renderPage(index) {
  notebook.querySelectorAll('.frame').forEach(f => f.remove());
  removeAddTextButton();

  notebook.classList.toggle('at-start', index === 0);

  loadDrawingIntoCanvas(pages[index].drawing);

  const frames = pages[index].frames || [];
  frames.forEach(data => {
    buildFrame({
      type: data.type,
      src: data.src,
      text: data.text,
      x: data.left + data.w / 2,
      y: data.top + data.h / 2,
      w: data.w,
      h: data.h,
      angle: data.angle,
      scale: data.scale,
      z: data.z,
      skipSelect: true
    });
  });

  hint.style.display = (frames.length || pages[index].drawing) ? 'none' : 'block';

  if (spreadEditMode) updateSpreadLabel();
}

function goForward() {
  pages[currentIndex].frames = collectFramesFromDOM();
  const isNewPage = currentIndex === pages.length - 1;
  if (isNewPage) {
    pushUndo();
    pages.push({ frames: [], drawing: null });
  }
  transitionTo(currentIndex + 1);
}

function goBackward() {
  if (currentIndex === 0) return;
  pages[currentIndex].frames = collectFramesFromDOM();
  transitionTo(currentIndex - 1);
}

function transitionTo(newIndex) {
  blackout.classList.add('show');
  const onFadeIn = () => {
    blackout.removeEventListener('transitionend', onFadeIn);
    currentIndex = newIndex;
    renderPage(currentIndex);
    persistAll();
    requestAnimationFrame(() => blackout.classList.remove('show'));
  };
  blackout.addEventListener('transitionend', onFadeIn, { once: true });
}

/* ============================================================
   ページ削除機能
   ============================================================ */
function deletePage(index) {
  if (pages.length <= 1) {
    alert('これ以上ページを削除できません（最低1ページ必要です）。');
    return;
  }
  const ok = confirm('このページを削除しますか？貼り付けた画像・テキスト・手書きも失われます。');
  if (!ok) return;

  pushUndo();

  pages.splice(index, 1);

  if (index < currentIndex) currentIndex -= 1;
  currentIndex = Math.min(currentIndex, pages.length - 1);

  renderPage(currentIndex);
  persistAll();
}

pageDeleteBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  deletePage(currentIndex);
});

/* ============================================================
   サムネイル一覧（ドラッグで入れ替え）
   ============================================================ */
let draggedThumb = null;
let draggedIndex = -1;

function renderThumbnails() {
  thumbPanel.innerHTML = '';
  const scale = THUMB_W / BOOK_W;

  pages.forEach((page, index) => {
    const item = document.createElement('div');
    item.className = 'thumb-item' + (index === currentIndex ? ' active' : '');
    item.style.backgroundImage = `url('${NOTEBOOK_BG_URL}')`;
    item.draggable = true;
    item.dataset.index = index;

    const inner = document.createElement('div');
    inner.className = 'thumb-inner';
    inner.style.transform = `scale(${scale})`;

    if (page.drawing) {
      const drawImg = document.createElement('img');
      drawImg.className = 'thumb-draw-img';
      drawImg.src = page.drawing;
      inner.appendChild(drawImg);
    }

    (page.frames || []).forEach(f => {
      const fr = document.createElement('div');
      fr.className = 'thumb-frame';
      fr.style.left = f.left + 'px';
      fr.style.top = f.top + 'px';
      fr.style.width = f.w + 'px';
      fr.style.height = f.h + 'px';
      fr.style.transform = `rotate(${f.angle || 0}deg) scale(${f.scale || 1})`;

      if (f.type === 'image') {
        const img = document.createElement('img');
        img.src = f.src;
        fr.appendChild(img);
      } else {
        const txt = document.createElement('div');
        txt.className = 'thumb-text';
        txt.textContent = f.text || '';
        fr.appendChild(txt);
      }
      inner.appendChild(fr);
    });

    const label = document.createElement('div');
    label.className = 'thumb-label';
    label.textContent = (index + 1);

    const delBtn = document.createElement('div');
    delBtn.className = 'thumb-delete';
    delBtn.textContent = '✕';
    delBtn.title = 'このページを削除';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deletePage(index);
    });

    item.appendChild(inner);
    item.appendChild(label);
    item.appendChild(delBtn);

    item.addEventListener('click', () => {
      if (index === currentIndex) return;
      pages[currentIndex].frames = collectFramesFromDOM();
      pages[currentIndex].drawing = drawCanvas.toDataURL('image/png');
      transitionTo(index);
    });

    item.addEventListener('dragstart', (e) => {
      draggedThumb = item;
      draggedIndex = index;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      draggedThumb = null;
      draggedIndex = -1;
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!draggedThumb || draggedThumb === item) return;

      const targetIndex = parseInt(item.dataset.index);
      if (draggedIndex === targetIndex) return;

      pushUndo();

      const [movedPage] = pages.splice(draggedIndex, 1);
      pages.splice(targetIndex, 0, movedPage);

      if (currentIndex === draggedIndex) {
        currentIndex = targetIndex;
      } else if (draggedIndex < currentIndex && targetIndex >= currentIndex) {
        currentIndex--;
      } else if (draggedIndex > currentIndex && targetIndex <= currentIndex) {
        currentIndex++;
      }

      draggedIndex = targetIndex;
      persistAll();
    });

    thumbPanel.appendChild(item);
  });
}

/* ============================================================
   拡大表示（見開きビュー）：この1枚の画像をそのまま拡大するだけ
   ============================================================ */
function openSpreadView() {
  document.body.classList.add('spread-mode');
  spreadZoom = 1; spreadPanX = 0; spreadPanY = 0;
  updateSpreadPageSize();
  mountNotebookInSpread();
  spreadView.classList.add('show');
  updateSpreadNavState();
  spreadViewBtn.classList.add('active');
}

function closeSpreadView() {
  if (!spreadEditMode) return;
  pages[currentIndex].frames = collectFramesFromDOM();
  try {
    pages[currentIndex].drawing = drawCanvas.toDataURL('image/png');
  } catch (err) {
    console.warn('描画データの保存に失敗しました', err);
  }
  unmountNotebookFromSpread();
  persistAll();

  spreadView.classList.remove('show');
  document.body.classList.remove('spread-mode');
  computeBaseScale();
  renderPage(currentIndex);
  spreadViewBtn.classList.remove('active');
}

function mountNotebookInSpread() {
  spreadEditMode = true;
  notebook.classList.add('in-spread');
  notebook.style.top = '0';
  notebook.style.left = '0';
  notebook.style.width = BOOK_W + 'px';
  notebook.style.height = BOOK_H + 'px';
  notebook.style.transformOrigin = 'top left';
  applySpreadTransform();
  spreadPage.appendChild(notebook);
  updateSpreadLabel();
}

function unmountNotebookFromSpread() {
  spreadEditMode = false;
  notebook.classList.remove('in-spread');
  notebook.style.top = '';
  notebook.style.left = '';
  notebook.style.width = '';
  notebook.style.height = '';
  notebook.style.transformOrigin = '';
  notebook.style.transform = '';
  bookWrap.appendChild(notebook);
}

function updateSpreadLabel() {
  spreadPageLabel.textContent = (currentIndex + 1) + ' / ' + pages.length;
}

function updateSpreadNavState() {
  spreadPrevBtn.classList.toggle('disabled', currentIndex <= 0);
}

spreadViewBtn.addEventListener('click', () => {
  if (spreadView.classList.contains('show')) {
    closeSpreadView();
  } else {
    openSpreadView();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && spreadView.classList.contains('show')) {
    closeSpreadView();
  }
});

spreadPrevBtn.addEventListener('click', () => {
  goBackward();
  updateSpreadNavState();
});
spreadNextBtn.addEventListener('click', () => {
  goForward();
  updateSpreadNavState();
});

/* ===== ノート内タップ：端ならページめくり／それ以外はテキスト追加 ===== */
let notebookTapStart = null;

notebook.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) { notebookTapStart = null; return; }
  if (mode !== 'select') { notebookTapStart = null; return; }
  if (e.target.closest('.frame') || e.target.closest('.add-text-btn')) { notebookTapStart = null; return; }
  notebookTapStart = { x: e.clientX, y: e.clientY, t: Date.now(), id: e.pointerId };
});

notebook.addEventListener('pointerup', (e) => {
  if (isPinching) { notebookTapStart = null; return; }
  if (!notebookTapStart || e.pointerId !== notebookTapStart.id) return;

  const dx = e.clientX - notebookTapStart.x;
  const dy = e.clientY - notebookTapStart.y;
  const dt = Date.now() - notebookTapStart.t;
  const start = notebookTapStart;
  notebookTapStart = null;

  if (Math.hypot(dx, dy) > 12 || dt > 600) return;
  if (mode !== 'select') return;

  const rect = notebook.getBoundingClientRect();
  const x = start.x - rect.left;

  if (!spreadEditMode) {
    if (x >= rect.width - EDGE_SIZE) {
      goForward();
      return;
    }
    if (x <= EDGE_SIZE && currentIndex > 0) {
      goBackward();
      return;
    }
  }
  showAddTextButton({ clientX: start.x, clientY: start.y });
});

notebook.addEventListener('pointercancel', () => { notebookTapStart = null; });

notebook.addEventListener('mousemove', (e) => {
  if (mode !== 'select' || spreadEditMode) return;
  const rect = notebook.getBoundingClientRect();
  const x = e.clientX - rect.left;
  notebook.classList.toggle('hover-right', x >= rect.width - EDGE_SIZE);
  notebook.classList.toggle('hover-left', x <= EDGE_SIZE && currentIndex > 0);
});
notebook.addEventListener('mouseleave', () => {
  notebook.classList.remove('hover-right', 'hover-left');
});

/* ===== 新規画像のドロップ ===== */
notebook.addEventListener('dragover', (e) => e.preventDefault());

notebook.addEventListener('drop', (e) => {
  e.preventDefault();
  if (mode !== 'select') return;
  const { x, y } = screenToNotebook(e.clientX, e.clientY);

  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    [...e.dataTransfer.files].forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = ev => createImageFrame(ev.target.result, x, y);
      reader.readAsDataURL(file);
    });
    return;
  }

  const url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  if (url && url.startsWith('http')) {
    createImageFrame(url, x, y);
  }
});

function showAddTextButton(e) {
  removeAddTextButton();
  const { x, y } = screenToNotebook(e.clientX, e.clientY);

  const btn = document.createElement('div');
  btn.className = 'add-text-btn';
  btn.textContent = '＋ テキスト追加';
  btn.style.left = x + 'px';
  btn.style.top = y + 'px';
  btn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    createTextFrame(x, y);
    removeAddTextButton();
  });
  notebook.appendChild(btn);
}

function removeAddTextButton() {
  const existing = notebook.querySelector('.add-text-btn');
  if (existing) existing.remove();
}

document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.frame')) {
    document.querySelectorAll('.frame.selected').forEach(f => f.classList.remove('selected'));
  }
  if (!e.target.closest('.add-text-btn')) {
    removeAddTextButton();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    const active = document.activeElement;
    if (active && active.classList.contains('text-content') && active.classList.contains('editing')) return;
    const sel = document.querySelector('.frame.selected');
    if (sel) {
      pushUndo();
      sel.remove();
      persistAll();
    }
  }
});
/* ============================================================
   コピー＆ペースト（ノート内フレームの複製 / 外部画像の貼り付け）
   ============================================================ */
let internalClipboard = null;

function isEditingText() {
  const active = document.activeElement;
  return !!(active && active.classList && active.classList.contains('text-content') && active.classList.contains('editing'));
}

document.addEventListener('keydown', (e) => {
  const isCopyKey = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c';
  const isPasteKey = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v';

  if (isEditingText()) return; // テキスト編集中は通常のコピペを優先する

  if (isCopyKey) {
    const sel = document.querySelector('.frame.selected');
    if (sel) {
      internalClipboard = frameElementToData(sel);
    }
  }

  if (isPasteKey && internalClipboard) {
    e.preventDefault();
    pushUndo();
    const data = internalClipboard;
    const offset = 24;
    buildFrame({
      type: data.type,
      src: data.src,
      text: data.text,
      x: data.left + data.w / 2 + offset,
      y: data.top + data.h / 2 + offset,
      w: data.w,
      h: data.h,
      angle: data.angle,
      scale: data.scale
    });
    persistAll();
  }
});

/* 外部（OSクリップボード）からの画像貼り付け対応 */
document.addEventListener('paste', (e) => {
  if (isEditingText()) return; // テキスト編集中は通常のペーストを優先
  if (mode !== 'select') return;

  const items = e.clipboardData ? e.clipboardData.items : null;
  if (!items) return;

  const imageItems = [...items].filter(item => item.type && item.type.startsWith('image/'));
  if (imageItems.length === 0) return;

  // 透過情報を保持できるPNGがあれば優先して使う（無ければ他の画像形式にフォールバック）
  const pngItem = imageItems.find(item => item.type === 'image/png');
  const chosenItem = pngItem || imageItems[0];

  const file = chosenItem.getAsFile();
  if (!file) return;

  e.preventDefault();
  const reader = new FileReader();
  reader.onload = (ev) => {
    createImageFrame(ev.target.result, BOOK_W / 2, BOOK_H / 2);
  };
  reader.readAsDataURL(file);
});
/* ===== 画像フレーム生成 ===== */
function createImageFrame(src, x, y) {
  hint.style.display = 'none';
  const probe = new Image();
  probe.onload = () => {
    const maxDim = 200;
    let w = probe.naturalWidth || 160;
    let h = probe.naturalHeight || 160;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    w *= scale; h *= scale;
    pushUndo();
    buildFrame({ type: 'image', src, x, y, w, h });
    persistAll();
  };
  probe.onerror = () => {
    pushUndo();
    buildFrame({ type: 'image', src, x, y, w: 160, h: 160 });
    persistAll();
  };
  probe.src = src;
}

function createTextFrame(x, y) {
  hint.style.display = 'none';
  pushUndo();
  buildFrame({ type: 'text', x, y, w: 180, h: 60 });
}

/* ===== フレーム構築（共通） ===== */
function buildFrame({ type, src, text, x, y, w, h, angle = 0, scale = 1, z, skipSelect = false }) {
  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.style.width = w + 'px';
  frame.style.height = h + 'px';
  frame.style.left = (x - w / 2) + 'px';
  frame.style.top = (y - h / 2) + 'px';
  frame.dataset.angle = angle;
  frame.dataset.scale = scale;
  if (z) {
    frame.style.zIndex = z;
    zIndexCounter = Math.max(zIndexCounter, z);
  }

  const inner = type === 'image'
    ? `<img src="${src}" draggable="false" alt="">`
    : `<div class="text-content" contenteditable="false">${text ? escapeHtml(text) : ''}</div>`;

  const cropBtn = type === 'image' ? '<div class="tool-btn tool-crop" title="トリミング">✂</div>' : '';

  const cropMask = type === 'image' ? `
    <div class="crop-mask">
      <div class="crop-mask-overlay crop-mask-top"></div>
      <div class="crop-mask-overlay crop-mask-bottom"></div>
      <div class="crop-mask-overlay crop-mask-left"></div>
      <div class="crop-mask-overlay crop-mask-right"></div>
      <div class="crop-area">
        <div class="crop-handle nw"></div>
        <div class="crop-handle ne"></div>
        <div class="crop-handle sw"></div>
        <div class="crop-handle se"></div>
      </div>
    </div>
  ` : '';

  const cropControls = type === 'image' ? `
    <div class="crop-controls">
      <div class="crop-control-btn crop-apply" title="適用">✓</div>
      <div class="crop-control-btn crop-cancel" title="キャンセル">✕</div>
    </div>
  ` : '';

  frame.innerHTML = `
    ${inner}
    ${cropMask}
    <div class="handle nw"></div>
    <div class="handle ne"></div>
    <div class="handle sw"></div>
    <div class="handle se"></div>
    <div class="toolbar">
      <div class="tool-btn tool-rotate" title="回転">⟳</div>
      ${cropBtn}
      <div class="tool-btn tool-duplicate" title="複製">⧉</div>
      <div class="tool-btn tool-delete" title="削除">✕</div>
    </div>
    ${cropControls}
  `;

  notebook.appendChild(frame);
  initFrame(frame);
  applyTransform(frame);

  if (!skipSelect) selectFrame(frame);

  if (type === 'text' && !skipSelect) {
    const textEl = frame.querySelector('.text-content');
    enterEditMode(frame, textEl);
  }

  return frame;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.innerText = str;
  return div.innerHTML;
}

/* ===== フレームへのイベント登録 ===== */
function initFrame(frame) {
  frame.addEventListener('dragstart', e => e.preventDefault());

frame.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return; // 左クリック以外（中クリック等）は無視してパン操作を優先させる
    if (mode !== 'select') return;
    if (isPinching) return;
    if (e.target.closest('.handle') || e.target.closest('.tool-btn') || e.target.closest('.crop-control-btn') || e.target.closest('.crop-handle')) return;
    if (frame.classList.contains('editing-frame')) return;

    if (!frame.classList.contains('cropping')) {
      selectFrame(frame);
      pushUndo();
      startMove(e, frame);
    }
  });

  frame.querySelectorAll('.handle').forEach(handle => {
    const type =
      handle.classList.contains('nw') ? 'nw' :
      handle.classList.contains('ne') ? 'ne' :
      handle.classList.contains('sw') ? 'sw' : 'se';

    handle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (isPinching) return;
      if (!frame.classList.contains('cropping')) {
        pushUndo();
        startResize(e, frame, type);
      }
    });
  });

  frame.querySelector('.tool-rotate').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    if (isPinching) return;
    pushUndo();
    startRotate(e, frame);
  });

  const cropBtn = frame.querySelector('.tool-crop');
  if (cropBtn) {
    cropBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startCrop(frame);
    });
  }

  const cropArea = frame.querySelector('.crop-area');
  if (cropArea) {
    cropArea.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.crop-handle')) return;
      e.stopPropagation();
      startCropMove(e, frame);
    });
  }

  frame.querySelectorAll('.crop-handle').forEach(handle => {
    const type =
      handle.classList.contains('nw') ? 'nw' :
      handle.classList.contains('ne') ? 'ne' :
      handle.classList.contains('sw') ? 'sw' : 'se';

    handle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      startCropResize(e, frame, type);
    });
  });

  const applyBtn = frame.querySelector('.crop-apply');
  const cancelBtn = frame.querySelector('.crop-cancel');
  if (applyBtn) {
    applyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      applyCrop(frame);
    });
  }
  if (cancelBtn) {
    cancelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      cancelCrop(frame);
    });
  }

  frame.querySelector('.tool-duplicate').addEventListener('click', (e) => {
    e.stopPropagation();
    pushUndo();
    duplicateFrame(frame);
  });

  frame.querySelector('.tool-delete').addEventListener('click', (e) => {
    e.stopPropagation();
    pushUndo();
    frame.remove();
    persistAll();
  });

  const textEl = frame.querySelector('.text-content');
  if (textEl) {
    textEl.addEventListener('blur', () => exitEditMode(frame, textEl));
    textEl.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      pushUndo();
      enterEditMode(frame, textEl);
    });
    textEl.addEventListener('pointerdown', (e) => {
      if (textEl.classList.contains('editing')) e.stopPropagation();
    });
  }
}

function enterEditMode(frame, textEl) {
  selectFrame(frame);
  frame.classList.add('editing-frame');
  textEl.classList.add('editing');
  textEl.setAttribute('contenteditable', 'true');
  textEl.focus();
  const range = document.createRange();
  range.selectNodeContents(textEl);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function exitEditMode(frame, textEl) {
  frame.classList.remove('editing-frame');
  textEl.classList.remove('editing');
  textEl.setAttribute('contenteditable', 'false');
  if (textEl.textContent.trim() === '') {
    frame.remove();
  }
  persistAll();
}

function selectFrame(frame) {
  document.querySelectorAll('.frame.selected').forEach(f => {
    if (f !== frame) f.classList.remove('selected');
  });
  frame.classList.add('selected');
  frame.style.zIndex = ++zIndexCounter;
}

/* ===== 移動 ===== */
function startMove(e, frame) {
  const startPt = screenToNotebook(e.clientX, e.clientY);
  const startLeft = parseFloat(frame.style.left);
  const startTop = parseFloat(frame.style.top);
  frame.setPointerCapture(e.pointerId);
  frame.style.cursor = 'grabbing';

  function onMove(ev) {
    const pt = screenToNotebook(ev.clientX, ev.clientY);
    frame.style.left = (startLeft + (pt.x - startPt.x)) + 'px';
    frame.style.top = (startTop + (pt.y - startPt.y)) + 'px';
  }
  function onUp() {
    activeFrameDragEnd = null;
    frame.style.cursor = 'grab';
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    frame.removeEventListener('pointercancel', onUp);
    frame.removeEventListener('lostpointercapture', onUp);
    persistAll();
  }
  activeFrameDragEnd = onUp;
  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
  frame.addEventListener('pointercancel', onUp);
  frame.addEventListener('lostpointercapture', onUp);
}

/* ===== 拡大縮小 ===== */
function startResize(e, frame, handleType) {
  e.preventDefault();

  const w = parseFloat(frame.style.width);
  const h = parseFloat(frame.style.height);
  const startFrameScale = parseFloat(frame.dataset.scale) || 1;
  const angle = (parseFloat(frame.dataset.angle) || 0) * Math.PI / 180;
  const cosA = Math.cos(angle), sinA = Math.sin(angle);

  const frameLeft = parseFloat(frame.style.left);
  const frameTop = parseFloat(frame.style.top);
  const cx = frameLeft + w / 2;
  const cy = frameTop + h / 2;

  const hw = w / 2, hh = h / 2;

  let anchorBase;
  switch (handleType) {
    case 'nw': anchorBase = { x:  hw, y:  hh }; break;
    case 'ne': anchorBase = { x: -hw, y:  hh }; break;
    case 'sw': anchorBase = { x:  hw, y: -hh }; break;
    case 'se': anchorBase = { x: -hw, y: -hh }; break;
  }

  const anchorX = cx + (anchorBase.x * cosA - anchorBase.y * sinA) * startFrameScale;
  const anchorY = cy + (anchorBase.x * sinA + anchorBase.y * cosA) * startFrameScale;

  const diffBaseX = -2 * anchorBase.x;
  const diffBaseY = -2 * anchorBase.y;
  const diffBaseLen = Math.hypot(diffBaseX, diffBaseY);
  const unitX = diffBaseX / diffBaseLen;
  const unitY = diffBaseY / diffBaseLen;

  frame.setPointerCapture(e.pointerId);

  function onMove(ev) {
    const pt = screenToNotebook(ev.clientX, ev.clientY);
    const vecX = pt.x - anchorX;
    const vecY = pt.y - anchorY;

    const vecLocalX = vecX * cosA + vecY * sinA;
    const vecLocalY = -vecX * sinA + vecY * cosA;

    const projLen = vecLocalX * unitX + vecLocalY * unitY;
    let newScale = projLen / diffBaseLen;
    newScale = Math.max(0.2, Math.min(6, newScale));

    const newCenterX = anchorX - (anchorBase.x * cosA - anchorBase.y * sinA) * newScale;
    const newCenterY = anchorY - (anchorBase.x * sinA + anchorBase.y * cosA) * newScale;

    frame.dataset.scale = newScale;
    frame.style.left = (newCenterX - hw) + 'px';
    frame.style.top  = (newCenterY - hh) + 'px';

    applyTransform(frame);
  }
  function onUp() {
    activeFrameDragEnd = null;
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    frame.removeEventListener('pointercancel', onUp);
    frame.removeEventListener('lostpointercapture', onUp);
    persistAll();
  }
  activeFrameDragEnd = onUp;
  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
  frame.addEventListener('pointercancel', onUp);
  frame.addEventListener('lostpointercapture', onUp);
}

function startRotate(e, frame) {
  const w = parseFloat(frame.style.width);
  const h = parseFloat(frame.style.height);
  const frameLeft = parseFloat(frame.style.left);
  const frameTop = parseFloat(frame.style.top);
  const cx = frameLeft + w / 2;
  const cy = frameTop + h / 2;

  const startAngle = parseFloat(frame.dataset.angle) || 0;
  const startPt = screenToNotebook(e.clientX, e.clientY);
  const startPointerAngle = Math.atan2(startPt.y - cy, startPt.x - cx) * 180 / Math.PI;

  frame.setPointerCapture(e.pointerId);

  function onMove(ev) {
    const pt = screenToNotebook(ev.clientX, ev.clientY);
    const pointerAngle = Math.atan2(pt.y - cy, pt.x - cx) * 180 / Math.PI;
    const newAngle = startAngle + (pointerAngle - startPointerAngle);
    frame.dataset.angle = newAngle;
    applyTransform(frame);
  }
  function onUp() {
    activeFrameDragEnd = null;
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    frame.removeEventListener('pointercancel', onUp);
    frame.removeEventListener('lostpointercapture', onUp);
    persistAll();
  }
  activeFrameDragEnd = onUp;
  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
  frame.addEventListener('pointercancel', onUp);
  frame.addEventListener('lostpointercapture', onUp);
}

function applyTransform(frame) {
  const angle = parseFloat(frame.dataset.angle) || 0;
  const scale = parseFloat(frame.dataset.scale) || 1;
  frame.style.transform = `rotate(${angle}deg) scale(${scale})`;

  const toolbar = frame.querySelector('.toolbar');
  if (toolbar) {
    toolbar.style.transform = `translate(-50%, 10px) rotate(${-angle}deg) scale(${1 / scale})`;
  }

  const cropControls = frame.querySelector('.crop-controls');
  if (cropControls) {
    cropControls.style.transform = `rotate(${-angle}deg) scale(${1 / scale})`;
  }

  frame.querySelectorAll('.handle').forEach(h => {
    h.style.transform = `scale(${1 / scale})`;
  });
}

function duplicateFrame(frame) {
  const clone = frame.cloneNode(true);
  clone.style.left = (parseFloat(frame.style.left) + 20) + 'px';
  clone.style.top = (parseFloat(frame.style.top) + 20) + 'px';
  clone.classList.remove('selected', 'editing-frame', 'cropping');

  const textEl = clone.querySelector('.text-content');
  if (textEl) {
    textEl.classList.remove('editing');
    textEl.setAttribute('contenteditable', 'false');
  }

  notebook.appendChild(clone);
  initFrame(clone);
  selectFrame(clone);
  applyTransform(clone);
  persistAll();
}

/* ============================================================
   インライントリミング機能
   ============================================================ */
function startCrop(frame) {
  const img = frame.querySelector('img');
  if (!img) return;

  pushUndo();

  croppingFrame = frame;
  frame.classList.add('cropping');
  frame.classList.remove('selected');

  const w = parseFloat(frame.style.width);
  const h = parseFloat(frame.style.height);
  const cropW = w * 0.8;
  const cropH = h * 0.8;
  const cropX = w * 0.1;
  const cropY = h * 0.1;

  cropStartData = {
    originalSrc: img.src,
    frameWidth: w,
    frameHeight: h,
    cropX: cropX,
    cropY: cropY,
    cropW: cropW,
    cropH: cropH
  };

  updateCropMask(frame);
}

function updateCropMask(frame) {
  const data = cropStartData;
  if (!data) return;

  const maskTop = frame.querySelector('.crop-mask-top');
  const maskBottom = frame.querySelector('.crop-mask-bottom');
  const maskLeft = frame.querySelector('.crop-mask-left');
  const maskRight = frame.querySelector('.crop-mask-right');
  const cropArea = frame.querySelector('.crop-area');

  maskTop.style.height = data.cropY + 'px';
  maskBottom.style.height = (data.frameHeight - data.cropY - data.cropH) + 'px';

  maskLeft.style.top = data.cropY + 'px';
  maskLeft.style.height = data.cropH + 'px';
  maskLeft.style.width = data.cropX + 'px';

  maskRight.style.top = data.cropY + 'px';
  maskRight.style.height = data.cropH + 'px';
  maskRight.style.left = (data.cropX + data.cropW) + 'px';
  maskRight.style.width = (data.frameWidth - data.cropX - data.cropW) + 'px';

  cropArea.style.left = data.cropX + 'px';
  cropArea.style.top = data.cropY + 'px';
  cropArea.style.width = data.cropW + 'px';
  cropArea.style.height = data.cropH + 'px';
}

function startCropMove(e, frame) {
  const data = cropStartData;
  if (!data) return;

  const frameScale = parseFloat(frame.dataset.scale) || 1;
  const totalScale = getViewScale() * frameScale;

  const startX = e.clientX;
  const startY = e.clientY;
  const startCropX = data.cropX;
  const startCropY = data.cropY;

  const cropArea = frame.querySelector('.crop-area');
  cropArea.setPointerCapture(e.pointerId);

  function onMove(ev) {
    const dx = (ev.clientX - startX) / totalScale;
    const dy = (ev.clientY - startY) / totalScale;

    data.cropX = Math.max(0, Math.min(startCropX + dx, data.frameWidth - data.cropW));
    data.cropY = Math.max(0, Math.min(startCropY + dy, data.frameHeight - data.cropH));

    updateCropMask(frame);
  }

  function onUp() {
    cropArea.removeEventListener('pointermove', onMove);
    cropArea.removeEventListener('pointerup', onUp);
    cropArea.removeEventListener('pointercancel', onUp);
    cropArea.removeEventListener('lostpointercapture', onUp);
  }

  cropArea.addEventListener('pointermove', onMove);
  cropArea.addEventListener('pointerup', onUp);
  cropArea.addEventListener('pointercancel', onUp);
  cropArea.addEventListener('lostpointercapture', onUp);
}

function startCropResize(e, frame, handleType) {
  e.preventDefault();

  const data = cropStartData;
  if (!data) return;

  const frameScale = parseFloat(frame.dataset.scale) || 1;
  const totalScale = getViewScale() * frameScale;

  const startX = e.clientX;
  const startY = e.clientY;
  const startCropX = data.cropX;
  const startCropY = data.cropY;
  const startCropW = data.cropW;
  const startCropH = data.cropH;

  const handle = e.target;
  handle.setPointerCapture(e.pointerId);

  function onMove(ev) {
    const dx = (ev.clientX - startX) / totalScale;
    const dy = (ev.clientY - startY) / totalScale;

    switch (handleType) {
      case 'nw':
        data.cropX = Math.max(0, Math.min(startCropX + dx, startCropX + startCropW - 20));
        data.cropY = Math.max(0, Math.min(startCropY + dy, startCropY + startCropH - 20));
        data.cropW = startCropW - (data.cropX - startCropX);
        data.cropH = startCropH - (data.cropY - startCropY);
        break;
      case 'ne':
        data.cropY = Math.max(0, Math.min(startCropY + dy, startCropY + startCropH - 20));
        data.cropW = Math.max(20, Math.min(startCropW + dx, data.frameWidth - startCropX));
        data.cropH = startCropH - (data.cropY - startCropY);
        break;
      case 'sw':
        data.cropX = Math.max(0, Math.min(startCropX + dx, startCropX + startCropW - 20));
        data.cropW = startCropW - (data.cropX - startCropX);
        data.cropH = Math.max(20, Math.min(startCropH + dy, data.frameHeight - startCropY));
        break;
      case 'se':
        data.cropW = Math.max(20, Math.min(startCropW + dx, data.frameWidth - startCropX));
        data.cropH = Math.max(20, Math.min(startCropH + dy, data.frameHeight - startCropY));
        break;
    }

    updateCropMask(frame);
  }

  function onUp() {
    handle.removeEventListener('pointermove', onMove);
    handle.removeEventListener('pointerup', onUp);
    handle.removeEventListener('pointercancel', onUp);
    handle.removeEventListener('lostpointercapture', onUp);
  }

  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', onUp);
  handle.addEventListener('pointercancel', onUp);
  handle.addEventListener('lostpointercapture', onUp);
}

function applyCrop(frame) {
  const img = frame.querySelector('img');
  const data = cropStartData;
  if (!img || !data) return;

  const canvas = document.createElement('canvas');
  const cctx = canvas.getContext('2d');

  const tempImg = new Image();
  tempImg.onload = () => {
    const scaleX = tempImg.naturalWidth / data.frameWidth;
    const scaleY = tempImg.naturalHeight / data.frameHeight;

    const srcX = data.cropX * scaleX;
    const srcY = data.cropY * scaleY;
    const srcW = data.cropW * scaleX;
    const srcH = data.cropH * scaleY;

    canvas.width = srcW;
    canvas.height = srcH;

    cctx.drawImage(tempImg, srcX, srcY, srcW, srcH, 0, 0, srcW, srcH);

    img.src = canvas.toDataURL('image/png');

    frame.style.width = data.cropW + 'px';
    frame.style.height = data.cropH + 'px';
    frame.style.left = (parseFloat(frame.style.left) + data.cropX) + 'px';
    frame.style.top = (parseFloat(frame.style.top) + data.cropY) + 'px';

    frame.classList.remove('cropping');
    frame.classList.add('selected');
    croppingFrame = null;
    cropStartData = null;

    persistAll();
  };
  tempImg.src = data.originalSrc;
}

function cancelCrop(frame) {
  frame.classList.remove('cropping');
  frame.classList.add('selected');
  croppingFrame = null;
  cropStartData = null;
}

/* ============================================================
   起動時：ノート・サムネイル・見開きページ、すべてに背景画像を適用
   ============================================================ */
notebook.style.backgroundImage = `url('${NOTEBOOK_BG_URL}')`;
spreadPage.style.backgroundColor = '#fdfdf7';
spreadPage.style.backgroundImage = `url('${NOTEBOOK_BG_URL}')`;
spreadPage.style.backgroundRepeat = 'no-repeat';
spreadPage.style.backgroundPosition = 'center';
spreadPage.style.backgroundSize = '100% 100%';
</script>

<script>
/* ============================================================
   GitHub同期（Alex追加分）
   使い方：このブロック全体を、index.html の </body> の直前に貼るだけ。
   元のコードには一切手を入れていない（追加のみ）。

   - 保存先: kuranaga15/skechbook の data/book.json
   - 読み込み: 公開リポジトリなのでトークン不要。起動時、GitHub側のデータが
     この端末より新しければ、読み込むかどうか確認ダイアログを出す
   - 保存: ツールパネルに追加される「GH保存」ボタンから。
     fine-grained PAT（対象リポジトリ: skechbook / Contents: Read and write）が必要
   - トークンはこの端末のブラウザ（localStorage）にだけ保存される
   - 保存データの形式は既存の save / road（JSON書き出し・読み込み）と互換
   ============================================================ */
(function () {
  const GH_OWNER = 'kuranaga15';
  const GH_REPO = 'skechbook';
  const GH_BRANCH = 'main';
  const GH_DATA_PATH = 'data/book.json';
  const GH_TOKEN_KEY = 'sketchbook-gh-token';
  const LOCAL_UPDATED_KEY = 'sketchbook-local-updatedAt';

  /* ローカルの最終更新時刻を記録するため、元の persistAll を包む */
  const _persistAll = persistAll;
  persistAll = function () {
    _persistAll();
    try { localStorage.setItem(LOCAL_UPDATED_KEY, new Date().toISOString()); } catch (e) {}
  };

  /* ===== ツールパネルにボタン追加 ===== */
  const panel = document.getElementById('toolPanel');
  const divider = document.createElement('div');
  divider.className = 'tool-divider';
  panel.appendChild(divider);

  function makeBtn(label, title) {
    const d = document.createElement('div');
    d.className = 'tool-io-btn';
    d.textContent = label;
    d.title = title;
    panel.appendChild(d);
    return d;
  }
  const ghSaveBtn = makeBtn('GH保存', 'GitHubに保存');
  const ghLoadBtn = makeBtn('GH読込', 'GitHubから読み込み');
  const ghKeyBtn  = makeBtn('GH鍵', 'GitHubトークンの設定');

  /* ===== トークン管理 ===== */
  function getToken() {
    try { return localStorage.getItem(GH_TOKEN_KEY) || ''; } catch (e) { return ''; }
  }
  function askToken() {
    const t = prompt('GitHubのトークンを貼り付けてください。\n（この端末のブラウザにだけ保存されます。空欄でOKすると削除します）', '');
    if (t === null) return null;
    const v = t.trim();
    try {
      if (v) localStorage.setItem(GH_TOKEN_KEY, v);
      else localStorage.removeItem(GH_TOKEN_KEY);
    } catch (e) {}
    return v;
  }
  function ensureToken() {
    let t = getToken();
    if (!t) t = askToken();
    return t;
  }
  ghKeyBtn.addEventListener('click', () => {
    const t = askToken();
    if (t) alert('トークンを保存しました。');
  });

  /* ===== GitHub API ===== */
  async function ghApi(path, options) {
    const token = ensureToken();
    if (!token) throw new Error('トークンが未設定です');
    const res = await fetch('https://api.github.com' + path, Object.assign({}, options || {}, {
      cache: 'no-store',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      }
    }));
    if (!res.ok) {
      let msg = '';
      try { msg = (await res.json()).message || ''; } catch (e) {}
      throw new Error('GitHub APIエラー ' + res.status + (msg ? '：' + msg : ''));
    }
    return res.json();
  }

  function utf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    const CHUNK = 0x8000;
    for (let i = 0; i < bytes.length; i += CHUNK) {
      bin += String.fromCharCode.apply(null, Array.from(bytes.subarray(i, i + CHUNK)));
    }
    return btoa(bin);
  }

  /* ===== 保存（Git Data API経由：大きなファイルでも保存できる） ===== */
  let ghSaving = false;
  ghSaveBtn.addEventListener('click', async () => {
    if (ghSaving) return;
    if (!ensureToken()) return;
    ghSaving = true;
    const oldLabel = ghSaveBtn.textContent;
    ghSaveBtn.textContent = '保存中';
    try {
      pages[currentIndex].frames = collectFramesFromDOM();
      try { pages[currentIndex].drawing = drawCanvas.toDataURL('image/png'); } catch (e) {}
      const payload = {
        formatVersion: 3,
        exportedAt: new Date().toISOString(),
        currentIndex: currentIndex,
        pages: pages
      };
      const b64 = utf8ToBase64(JSON.stringify(payload));
      const base = '/repos/' + GH_OWNER + '/' + GH_REPO;
      const blob = await ghApi(base + '/git/blobs', {
        method: 'POST',
        body: JSON.stringify({ content: b64, encoding: 'base64' })
      });
      /* 保存が短時間に連続すると、先行する保存コミットと競合して
         422 (not a fast forward) になることがある。その場合は最新の
         先端を取り直して、最大4回まで自動で再試行する。 */
      let saved = false;
      let lastErr = null;
      for (let attempt = 0; attempt < 4 && !saved; attempt++) {
        try {
          const ref = await ghApi(base + '/git/ref/heads/' + GH_BRANCH);
          const baseCommit = await ghApi(base + '/git/commits/' + ref.object.sha);
          const tree = await ghApi(base + '/git/trees', {
            method: 'POST',
            body: JSON.stringify({
              base_tree: baseCommit.tree.sha,
              tree: [{ path: GH_DATA_PATH, mode: '100644', type: 'blob', sha: blob.sha }]
            })
          });
          const commit = await ghApi(base + '/git/commits', {
            method: 'POST',
            body: JSON.stringify({ message: 'sketchbook sync', tree: tree.sha, parents: [ref.object.sha] })
          });
          await ghApi(base + '/git/refs/heads/' + GH_BRANCH, {
            method: 'PATCH',
            body: JSON.stringify({ sha: commit.sha })
          });
          saved = true;
        } catch (e) {
          lastErr = e;
          if (!/422/.test(e.message)) throw e;
          await new Promise(r => setTimeout(r, 700));
        }
      }
      if (!saved) throw lastErr || new Error('保存できませんでした');
      try { localStorage.setItem(LOCAL_UPDATED_KEY, payload.exportedAt); } catch (e) {}
      alert('GitHubに保存しました。');
    } catch (err) {
      alert('GitHubへの保存に失敗しました。\n' + err.message);
    } finally {
      ghSaving = false;
      ghSaveBtn.textContent = oldLabel;
    }
  });

  /* ===== 読み込み ===== */
  async function fetchGitHubBook() {
    const url = 'https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/' + GH_BRANCH + '/' + GH_DATA_PATH + '?t=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data || !Array.isArray(data.pages) || data.pages.length === 0) return null;
    return data;
  }

  function applyBookData(data) {
    pushUndo();
    pages = data.pages;
    currentIndex = Math.min(data.currentIndex || 0, pages.length - 1);
    renderPage(currentIndex);
    _persistAll();
    try { localStorage.setItem(LOCAL_UPDATED_KEY, data.exportedAt || new Date().toISOString()); } catch (e) {}
  }

  ghLoadBtn.addEventListener('click', async () => {
    let data = null;
    try { data = await fetchGitHubBook(); } catch (e) {}
    if (!data) { alert('GitHubに保存されたデータがまだありません。'); return; }
    const ok = confirm('GitHubのデータを読み込みますか？\n（今の端末の内容は上書きされます。元に戻すボタンで復元できます）');
    if (!ok) return;
    applyBookData(data);
    alert('読み込みが完了しました。表示を更新します。');
    setTimeout(() => location.reload(), 500);
  });

  /* ===== 起動時チェック：GitHub側が新しければ知らせる ===== */
  async function checkOnStart() {
    for (let i = 0; i < 30 && (!pages || pages.length === 0); i++) {
      await new Promise(r => setTimeout(r, 200));
    }
    let data = null;
    try { data = await fetchGitHubBook(); } catch (e) { return; }
    if (!data) return;
    const ghTime = Date.parse(data.exportedAt || '') || 0;
    let localTime = 0;
    try { localTime = Date.parse(localStorage.getItem(LOCAL_UPDATED_KEY) || '') || 0; } catch (e) {}
    if (ghTime > localTime) {
      const ok = confirm('GitHubに、この端末より新しいスケッチブックがあります。読み込みますか？\n（今の端末の内容は上書きされます。元に戻すボタンで復元できます）');
      if (ok) { applyBookData(data); setTimeout(() => location.reload(), 500); }
    }
  }
  window.addEventListener('load', () => setTimeout(checkOnStart, 800));
})();
</script>

</body>
</html>
