<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HTMLスケッチブック</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: #555555;
    font-family: sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
  }

  /* ================= ズーム可能な舞台 ================= */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  .zoom-layer {
    transform-origin: center center;
    will-change: transform;
    touch-action: none;
  }

  .book-wrap {
    width: 640px;
    height: 860px;
    perspective: 2000px;
    position: relative;
    touch-action: none;
  }

  .notebook {
    position: absolute;
    inset: 0;
    background-color: #fdfdf7;
    box-shadow: inset 0 0 16px rgba(0,0,0,0.08), 0 10px 25px rgba(0,0,0,0.35);
    overflow: hidden;
    touch-action: none;
  }
  .notebook.hidden { display: none; }
  .notebook.right-page,
  .notebook.left-page {
    background-image:
      repeating-linear-gradient(to bottom, transparent 0px, transparent 29px, #848484 30px),
      repeating-linear-gradient(to right,  transparent 0px, transparent 29px, #848484 30px);
  }

  .notebook::before {
    content: "";
    position: absolute;
    top: 14px; bottom: 14px;
    width: 20px;
    z-index: 100;
    pointer-events: none;
    background-image: radial-gradient(circle 12px, #b6b4b0 11px, transparent 2px);
    background-repeat: repeat-y;
    background-size: 100% 60px;
  }
  .notebook.right-page::before { left: 16px; }
  .notebook.left-page::before  { right: 16px; }

  .cover {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #6b3f2a, #8a5a3b);
    background-size: cover;
    background-position: center;
    border-radius: 4px 10px 10px 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    cursor: pointer;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1.1s ease-in-out;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f0e6d6;
    font-size: 28px;
    letter-spacing: 4px;
    backface-visibility: hidden;
  }
  .cover::after{
    content: "";
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 45%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.06));
    z-index: 1;
  }
  .cover.open { transform: rotateY(-165deg); }
  .cover.no-anim { transition: none; }

  .cover-shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.05), rgba(0,0,0,0.45));
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    z-index: 1;
  }
  .cover.has-image .cover-shade { opacity: 1; }

  .cover-title {
    position: relative;
    z-index: 2;
    pointer-events: none;
  }
  .cover.has-image .cover-title {
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }

  .cover-replace-btn {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.5);
    color: #f0e6d6;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 7px 18px;
    border-radius: 20px;
    cursor: pointer;
    transition: background .2s;
    z-index: 20;
  }
  .cover-replace-btn:hover { background: rgba(255,255,255,0.3); }

  .blackout {
    position: fixed; inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
    z-index: 999;
  }
  .blackout.show { opacity: 1; }

  .hint {
    position: absolute;
    bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #9997;
    pointer-events: none;
  }

  .page-edge {
    position: absolute;
    top: 0; bottom: 0;
    width: 46px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    font-size: 24px;
    color: rgba(0,0,0,0.15);
    z-index: 2;
    transition: background .2s, color .2s, opacity .2s;
  }
  .page-edge-left { left: 0; background: linear-gradient(to right, rgba(0,0,0,0.05), transparent); }
  .page-edge-right { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.05), transparent); }
  .notebook.hover-left .page-edge-left,
  .notebook.hover-right .page-edge-right {
    background-color: rgba(74,144,226,0.12);
    color: rgba(74,144,226,0.7);
  }
  .notebook.at-start .page-edge-left { opacity: 0; }
  .notebook.hover-left, .notebook.hover-right { cursor: pointer; }

  .draw-canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 50;
    pointer-events: none;
    touch-action: none;
  }
  .notebook.drawing-mode .draw-canvas { pointer-events: auto; cursor: crosshair; }
  .notebook.drawing-mode .frame { pointer-events: none; }
  .notebook.erasing-mode .draw-canvas { cursor: cell; }

  .thumb-panel {
    position: fixed;
    top: 50%;
    right: 24px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 12px 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    z-index: 500;
  }
  .thumb-panel::-webkit-scrollbar { width: 6px; }
  .thumb-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

  /* ================= 縦画面レイアウト：サムネイルを上部に横並び ================= */
  body.mobile-layout .thumb-panel {
    top: 0;
    left: 0;
    right: 0;
    bottom: auto;
    transform: none;
    flex-direction: row;
    align-items: center;
    width: 100%;
    max-height: none;
    height: auto;
    overflow-x: auto;
    overflow-y: hidden;
    border-radius: 0 0 14px 14px;
    padding: 8px 12px;
    padding-top: max(8px, env(safe-area-inset-top));
  }
  body.mobile-layout .thumb-panel::-webkit-scrollbar { height: 6px; width: auto; }

  .thumb-item {
    position: relative;
    width: 74px;
    height: 100px;
    background: #fdfdf7;
    border: 2px solid transparent;
    border-radius: 5px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    flex-shrink: 0;
    transition: border-color .2s, transform .15s;
  }
  .thumb-item:hover { transform: scale(1.05); }
  .thumb-item.active { border-color: #4a90e2; }
  .thumb-item.cover-thumb {
    background: linear-gradient(135deg, #6b3f2a, #8a5a3b);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f0e6d6;
    font-size: 8px;
    letter-spacing: 1px;
    text-align: center;
  }
  .thumb-item.dragging {
    opacity: 0.5;
    transform: scale(0.95);
  }

  .thumb-inner {
    position: absolute;
    top: 0; left: 0;
    width: 640px;
    height: 860px;
    transform-origin: top left;
    pointer-events: none;
    background-color: #fdfdf7;
  }
  .thumb-inner.right-page,
  .thumb-inner.left-page {
    background-image:
      repeating-linear-gradient(to bottom, transparent 0px, transparent 29px, #dcdcdc 30px),
      repeating-linear-gradient(to right,  transparent 0px, transparent 29px, #dcdcdc 30px);
  }
  .thumb-inner::before {
    content: "";
    position: absolute;
    top: 14px; bottom: 14px;
    width: 40px;
    pointer-events: none;
    background-image: radial-gradient(circle 12px, #555 12px, transparent 12.5px);
    background-repeat: repeat-y;
    background-size: 100% 60px;
  }
  .thumb-inner.right-page::before { left: 16px; }
  .thumb-inner.left-page::before  { right: 16px; }

  .thumb-draw-img {
    position: absolute;
    top: 0; left: 0;
    width: 640px; height: 860px;
  }
  .thumb-frame {
    position: absolute;
    transform-origin: center center;
  }
  .thumb-frame img { width: 100%; height: 100%; display: block; }
  .thumb-frame .thumb-text {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #222;
    white-space: pre-wrap; word-break: break-word;
    overflow: hidden;
  }

  .thumb-label {
    position: absolute;
    bottom: 2px; left: 4px;
    font-size: 10px;
    color: #8887;
    z-index: 2;
    pointer-events: none;
  }

  .thumb-delete {
    position: absolute;
    top: 2px; right: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 3;
  }
  .thumb-delete:hover { background: #c0392b; }

  .tool-panel {
    position: fixed;
    top: 50%;
    left: 24px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 14px 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 14px;
    z-index: 500;
    max-height: 90vh;
    overflow-y: auto;
  }
  .tool-panel::-webkit-scrollbar { width: 6px; }
  .tool-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

  .tool-mode-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #333;
    color: #eee;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: background .15s, transform .1s, opacity .15s;
    flex-shrink: 0;
  }
  .tool-mode-btn:hover { transform: scale(1.07); }
  .tool-mode-btn.active { background: #4a90e2; color: #fff; }
  .tool-mode-btn.disabled { opacity: 0.3; pointer-events: none; }

  .tool-color {
    width: 36px; height: 36px;
    border: none;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    background: transparent;
    flex-shrink: 0;
  }
  .tool-color::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .tool-color::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; }

  .tool-size {
    width: 90px;
    transform: rotate(-90deg);
    margin: 30px 0;
  }

  .tool-divider {
    width: 28px; height: 1px;
    background: rgba(255,255,255,0.2);
    flex-shrink: 0;
  }

  .tool-clear-btn, .tool-delete-page-btn {
    font-size: 11px;
    color: #ddd;
    background: rgba(255,255,255,0.08);
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    line-height: 1.3;
    flex-shrink: 0;
  }
  .tool-clear-btn:hover { background: rgba(192,57,43,0.6); }
  .tool-delete-page-btn:hover { background: rgba(192,57,43,0.6); }

  .tool-io-btn {
    font-size: 11px;
    color: #ddd;
    background: rgba(255,255,255,0.08);
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    line-height: 1.3;
    flex-shrink: 0;
    width: 100%;
  }
  .tool-io-btn:hover { background: rgba(74,144,226,0.5); }

  /* ================= 縦画面レイアウト：ツールパネルを下部に横並び ================= */
  body.mobile-layout .tool-panel {
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    transform: none;
    flex-direction: row;
    align-items: center;
    width: 100%;
    max-height: none;
    max-width: 100vw;
    overflow-x: auto;
    overflow-y: hidden;
    border-radius: 14px 14px 0 0;
    padding: 8px 12px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    justify-content: flex-start;
    gap: 8px;
  }
  body.mobile-layout .tool-panel::-webkit-scrollbar { height: 6px; width: auto; }
  body.mobile-layout .tool-panel .tool-divider {
    width: 1px;
    height: 26px;
    flex-shrink: 0;
  }
  body.mobile-layout .tool-size {
    transform: none;
    margin: 0;
    width: 70px;
  }
  body.mobile-layout .tool-clear-btn,
  body.mobile-layout .tool-delete-page-btn,
  body.mobile-layout .tool-io-btn {
    width: auto;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .frame {
    position: absolute;
    touch-action: none;
    cursor: grab;
    transform-origin: center center;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
    caret-color: transparent;
    box-shadow: none;
    z-index: 10;
  }
  .frame.selected {
    box-shadow: 0 0 0 2px #4a90e2, 0 10px 25px rgba(0,0,0,0.4);
  }
  .frame.cropping {
    box-shadow: 0 0 0 2px #27ae60, 0 10px 25px rgba(0,0,0,0.4);
  }
  .frame img {
    width: 100%; height: 100%;
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    caret-color: transparent;
  }
  .frame.cropping img {
    opacity: 0.5;
  }

  .crop-mask {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
  }
  .frame.cropping .crop-mask {
    display: block;
  }
  .crop-mask-overlay {
    position: absolute;
    background: rgba(0,0,0,0.5);
  }
  .crop-mask-top { top: 0; left: 0; right: 0; }
  .crop-mask-bottom { bottom: 0; left: 0; right: 0; }
  .crop-mask-left { left: 0; }
  .crop-mask-right { right: 0; }
  .crop-area {
    position: absolute;
    border: 2px solid #27ae60;
    background: transparent;
    cursor: move;
    pointer-events: auto;
    touch-action: none;
  }

  .crop-handle {
    position: absolute;
    width: 14px; height: 14px;
    background: #fff;
    border: 2px solid #27ae60;
    border-radius: 50%;
    pointer-events: auto;
    z-index: 5;
    touch-action: none;
  }
  .crop-handle.nw { left: -7px; top: -7px; cursor: nwse-resize; }
  .crop-handle.ne { right: -7px; top: -7px; cursor: nesw-resize; }
  .crop-handle.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
  .crop-handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }

  .text-content {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #222;
    padding: 4px 8px;
    outline: none;
    cursor: grab;
    user-select: none;
    caret-color: transparent;
    white-space: pre-wrap;
    word-break: break-word;
    overflow: hidden;
  }
  .text-content.editing {
    cursor: text;
    user-select: text;
    -webkit-user-select: text;
    caret-color: #222;
    background: rgba(74,144,226,0.06);
  }

  .handle {
    position: absolute;
    width: 14px; height: 14px;
    background: #fff;
    border: 2px solid #4a90e2;
    border-radius: 50%;
    display: none;
    z-index: 5;
    touch-action: none;
  }
  .frame.selected .handle { display: block; }
  .frame.cropping .handle { display: none !important; }
  .frame.editing-frame .handle { display: none !important; }
  .handle.nw { left: -7px; top: -7px; cursor: nwse-resize; }
  .handle.ne { right: -7px; top: -7px; cursor: nesw-resize; }
  .handle.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
  .handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }

  .toolbar {
    position: absolute;
    left: 50%; top: 100%;
    display: none;
    gap: 8px;
    background: rgba(20,20,20,0.85);
    padding: 6px 10px;
    border-radius: 20px;
    z-index: 6;
  }
  .frame.selected .toolbar { display: flex; }
  .frame.cropping .toolbar { display: none !important; }
  .frame.editing-frame .toolbar { display: none !important; }

  .crop-controls {
    position: absolute;
    left: 50%; top: 100%;
    transform: translate(-50%, 10px);
    display: none;
    gap: 12px;
    background: rgba(20,20,20,0.9);
    padding: 8px;
    border-radius: 24px;
    z-index: 6;
  }
  .frame.cropping .crop-controls { display: flex; }

  .crop-control-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: transform .15s;
  }
  .crop-control-btn:hover { transform: scale(1.1); }
  .crop-apply {
    background: #27ae60;
    color: #fff;
  }
  .crop-cancel {
    background: #c0392b;
    color: #fff;
  }

  .tool-btn {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #333; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  .tool-btn:hover { background: #4a90e2; }
  .tool-rotate { cursor: grab; touch-action: none; }
  .tool-delete:hover { background: #c0392b; }
  .tool-crop:hover { background: #27ae60; }

  .add-text-btn {
    position: absolute;
    transform: translate(-10px, -10px);
    background: #4a90e2; color: #fff;
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
    z-index: 50;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    white-space: nowrap;
  }
  .add-text-btn:hover { background: #357abd; }

  .spread-view {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    z-index: 600;
  }
  .spread-view.show { display: flex; }

  .spread-page-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .spread-page {
    width: var(--spread-page-w, 320px);
    height: var(--spread-page-h, 430px);
    background-color: #fdfdf7;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform .15s;
  }
  .spread-page:hover { transform: scale(1.02); }
  .spread-page.empty {
    background-color: #262626;
    cursor: default;
  }
  .spread-page.empty:hover { transform: none; }
  .spread-page.cover-page {
    background: linear-gradient(135deg, #6b3f2a, #8a5a3b);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f0e6d6;
    font-size: 14px;
    letter-spacing: 2px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
  }

  .spread-inner {
    position: absolute;
    top: 0; left: 0;
    width: 640px;
    height: 860px;
    transform-origin: top left;
    pointer-events: none;
    background-color: #fdfdf7;
  }
  .spread-inner.right-page,
  .spread-inner.left-page {
    background-image:
      repeating-linear-gradient(to bottom, transparent 0px, transparent 29px, #dcdcdc 30px),
      repeating-linear-gradient(to right,  transparent 0px, transparent 29px, #dcdcdc 30px);
  }
  .spread-inner::before {
    content: "";
    position: absolute;
    top: 14px; bottom: 14px;
    width: 40px;
    pointer-events: none;
    background-image: radial-gradient(circle 12px, #555 12px, transparent 12.5px);
    background-repeat: repeat-y;
    background-size: 100% 60px;
  }
  .spread-inner.right-page::before { left: 16px; }
  .spread-inner.left-page::before  { right: 16px; }

  .spread-draw-img {
    position: absolute;
    top: 0; left: 0;
    width: 640px; height: 860px;
  }
  .spread-frame {
    position: absolute;
    transform-origin: center center;
  }
  .spread-frame img { width: 100%; height: 100%; display: block; }
  .spread-frame .spread-text {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #222;
    white-space: pre-wrap; word-break: break-word;
    overflow: hidden;
  }

  .spread-page-label {
    color: #999;
    font-size: 12px;
  }

  .spread-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px; height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    cursor: pointer;
    transition: background .15s;
  }
  .spread-nav:hover { background: rgba(74,144,226,0.5); }
  .spread-nav.disabled { opacity: 0.25; pointer-events: none; }
  .spread-nav-prev { left: 24px; }
  .spread-nav-next { right: 24px; }

  .spread-close-btn {
    position: absolute;
    top: 20px;
    right: 24px;
    background: rgba(192,57,43,0.85);
    color: #fff;
    padding: 8px 18px;
    border-radius: 18px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  .spread-close-btn:hover { background: rgba(192,57,43,1); }

  @media (max-width: 700px), (max-height: 700px) {
    .spread-view { gap: 3px; }
    .spread-page-wrap { gap: 3px; }
    .spread-nav { width: 34px; height: 34px; font-size: 16px; }
    .spread-nav-prev { left: 4px; }
    .spread-nav-next { right: 4px; }
    .spread-close-btn { top: 8px; right: 8px; padding: 6px 12px; font-size: 11px; }
    .spread-page-label { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="zoom-layer" id="zoomLayer">

      <div class="notebook right-page" id="notebook">

      </div>
    </div>
  </div>
</div>

<div class="tool-panel" id="toolPanel">
